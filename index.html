<meta name="theme-color" content="#0b1220">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    /* ---- palet ---- */
    --bg:#0b1220;        /* en arka zemin, gece lacivertine yakın */
    --panel:#141f38;     /* kart/panel yüzeyi, zeminden bir ton açık */
    --line:rgba(255,255,255,.09);  /* çok düşük kontrastlı ayraç çizgileri */
    --metin:#e9eefb;     /* ana metin, saf beyaz değil hafif mavimsi */
    --sonuk:#93a3bd;     /* ikincil metin, açıklama satırları */
    --mavi:#3b82f6;      /* birincil vurgu / aksiyon */
    --yesil:#22c55e;     /* başarı, doğru */
    --kirmizi:#ef4444;   /* hata, yanlış */
    --sari:#eab308;      /* uyarı, ipucu */
    --r:16px;            /* köşe yuvarlaklığı */

    /* ---- paletten türetilenler ---- */
    /* Üçüncü zemin katmanı. Hiyerarşi: --bg < --panel < --panel-acik */
    --panel-acik:color-mix(in srgb, var(--panel) 93%, var(--metin));
    --r-kucuk:calc(var(--r) / 2);   /* küçük öğeler için --r'nin yarısı */
    --perde:rgba(0,0,0,.6);         /* modal perdesi */

    /* Vurgu renklerinin %12 opaklıklı zemin hâlleri.
       Tam hâlleri kenarlık ve metin olarak kullanılır. */
    --mavi-yumusak:color-mix(in srgb, var(--mavi) 12%, transparent);
    --yesil-yumusak:color-mix(in srgb, var(--yesil) 12%, transparent);
    --kirmizi-yumusak:color-mix(in srgb, var(--kirmizi) 12%, transparent);
    --sari-yumusak:color-mix(in srgb, var(--sari) 12%, transparent);

    /* Öğrenme kutusu ölçeği (1 = yeni → 5 = ustalaşıldı).
       Yalnızca palet renklerinden türetilir, yeni renk eklenmez. */
    --kutu1:var(--kirmizi);
    --kutu2:var(--sari);
    --kutu3:var(--mavi);
    --kutu4:color-mix(in srgb, var(--yesil) 60%, var(--mavi));
    --kutu5:var(--yesil);
  }
  * { box-sizing: border-box; }
  /* display:flex gibi yazar kuralları tarayıcının [hidden] kuralını ezer;
     bu yüzden hidden özniteliği tek başına gizlemeye yetmiyordu. */
  [hidden] { display: none !important; }
  html, body { margin:0; padding:0; background:var(--bg); font-family:'Inter',system-ui,sans-serif; color:var(--metin); -webkit-tap-highlight-color:transparent; }
  #app { max-width:480px; margin:0 auto; padding:20px 16px 60px; min-height:100vh; }
  h1,h2,h3 { font-family:'Fraunces',Georgia,serif; margin:0; }
  .mono { font-family:'IBM Plex Mono',ui-monospace,monospace; }
  .muted { color:var(--sonuk); }
  button { font-family:inherit; border:none; cursor:pointer; }
  input, textarea { font-family:inherit; }
  .btn { border-radius:var(--r-kucuk); padding:13px; font-weight:600; font-size:14px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-primary { background:var(--mavi); color:#fff; }
  /* Sarı dolu zemin üzerinde beyaz metin okunmuyor (kontrast ~2:1).
     Kuralın öngördüğü yumuşak zemin + tam renk kenarlık/metin biçimi. */
  .btn-gold { background:var(--sari-yumusak); color:var(--sari); border:1.5px solid var(--sari); }
  .btn-outline { background:transparent; color:var(--metin); border:1.5px dashed var(--line); }
  .btn-ghost { background:var(--panel); color:var(--metin); border:1px solid var(--line); }
  .btn:disabled { opacity:0.4; cursor:default; }
  .row { display:flex; align-items:center; justify-content:space-between; }
  .top-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .user-switch { display:flex; gap:6px; margin-bottom:14px; }
  .user-pill { flex:1; text-align:center; padding:9px 6px; border-radius:var(--r-kucuk); background:var(--panel); border:1.5px solid var(--line); color:var(--sonuk); font-weight:600; font-size:13px; }
  .user-pill.active { background:var(--mavi-yumusak); border-color:var(--mavi); color:var(--mavi); }
  .nav-row { display:flex; gap:8px; margin-bottom:18px; }
  .nav-btn { flex:1; padding:9px; border-radius:var(--r-kucuk); background:var(--panel); border:1px solid var(--line); color:var(--metin); font-size:13px; font-weight:600; }
  .streak-pill { display:flex; align-items:center; gap:5px; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:14px; font-weight:600; color:var(--sari); }
  .deck-card { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-bottom:12px; cursor:pointer; }
  .deck-name { font-size:18px; font-weight:600; }
  .due-badge { font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--mavi-yumusak); color:var(--mavi); white-space:nowrap; }
  .progress-track { width:100%; height:6px; border-radius:var(--r-kucuk); background:var(--line); overflow:hidden; margin-top:8px; }
  .progress-fill { height:100%; background:var(--yesil); }
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stage-header { display:flex; align-items:center; gap:8px; margin:20px 0 8px; font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--sonuk); }
  .stage-header .count { font-family:'IBM Plex Mono',monospace; }
  .card-row { display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:var(--r-kucuk); padding:10px 12px; margin-bottom:8px; }
  .thumb { width:38px; height:38px; border-radius:var(--r-kucuk); object-fit:cover; flex-shrink:0; background:var(--panel-acik); }
  .card-row .front { font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card-row .back { font-size:12px; color:var(--sonuk); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vis-tag { font-size:10px; padding:2px 6px; border-radius:999px; background:var(--panel-acik); color:var(--sonuk); flex-shrink:0; }
  .box-dots { display:flex; align-items:center; gap:4px; flex-shrink:0; }
  .box-label { font-size:11px; font-weight:700; color:var(--sonuk); margin-right:2px; }
  .box-dot { width:11px; height:11px; border-radius:50%; background:var(--line); cursor:pointer; }
  .box-dot.on1 { background:var(--kutu1); }
  .box-dot.on2 { background:var(--kutu2); }
  .box-dot.on3 { background:var(--kutu3); }
  .box-dot.on4 { background:var(--kutu4); }
  .box-dot.on5 { background:var(--kutu5); }
  .app-logo { width:38px; height:38px; flex-shrink:0; }
  .brand { display:flex; align-items:center; gap:10px; min-width:0; }
  .icon-btn { background:none; padding:4px; color:var(--sonuk); flex-shrink:0; }
  .icon-btn.danger { color:var(--kirmizi); }
  .back-link { display:flex; align-items:center; gap:4px; font-size:14px; color:var(--sonuk); background:none; margin-bottom:16px; padding:0; }
  .modal-overlay { position:fixed; inset:0; background:var(--perde); display:flex; align-items:flex-end; justify-content:center; z-index:50; padding:0 16px 16px; }
  .modal { width:100%; max-width:480px; background:var(--panel-acik); border:1px solid var(--line); border-radius:var(--r); max-height:85vh; display:flex; flex-direction:column; overflow:hidden; }
  .modal-body { padding:20px; overflow-y:auto; flex:1; min-height:0; }
  .modal-footer { padding:12px 20px 18px; border-top:1px solid var(--line); flex-shrink:0; }
  .modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .field-label { font-size:12px; color:var(--sonuk); display:flex; align-items:center; gap:5px; margin-bottom:6px; }
  textarea, .text-input { width:100%; border-radius:var(--r-kucuk); padding:10px 12px; background:var(--panel); color:var(--metin); border:1px solid var(--line); outline:none; resize:none; margin-bottom:14px; font-size:14px; }
  .autogrow { overflow-y:hidden; transition:height .1s ease; }
  .img-picker { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .img-preview { width:56px; height:56px; border-radius:var(--r-kucuk); object-fit:cover; background:var(--panel); flex-shrink:0; }
  .img-pick-btn { font-size:12px; padding:8px 12px; border-radius:var(--r-kucuk); background:var(--panel); color:var(--metin); border:1px solid var(--line); }
  .img-remove-btn { font-size:12px; color:var(--kirmizi); background:none; }
  .visibility-toggle { display:flex; gap:8px; margin-bottom:16px; }
  .vis-pill { flex:1; text-align:center; padding:9px 6px; border-radius:var(--r-kucuk); background:var(--panel); border:1.5px solid var(--line); color:var(--sonuk); font-size:12.5px; font-weight:600; }
  .vis-pill.active { background:var(--mavi-yumusak); border-color:var(--mavi); color:var(--mavi); }
  .perspective { perspective:1500px; height:300px; margin-bottom:20px; }
  .flip-inner { position:relative; width:100%; height:100%; cursor:pointer; transition:transform .6s cubic-bezier(.65,0,.35,1); transform-style:preserve-3d; }
  .flip-inner:active { transition-duration:.15s; }
  .flip-inner.flipped { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; border-radius:var(--r); background:var(--panel-acik); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; backface-visibility:hidden; border:1px solid var(--line); }
  .face.back { transform:rotateY(180deg); background:var(--panel); }
  .face-label { position:absolute; top:16px; left:20px; font-size:10px; letter-spacing:2px; color:var(--sonuk); }
  .face img { width:90px; height:90px; border-radius:var(--r-kucuk); object-fit:cover; margin-bottom:14px; }
  .face-text { font-family:'Fraunces',Georgia,serif; font-size:21px; font-weight:600; color:var(--metin); padding:0 8px; white-space:pre-wrap; word-break:break-word; }
  .answer-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:10px; }
  .answer-btn { border-radius:var(--r); padding:15px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px; }
  .master-btn { width:100%; border-radius:var(--r-kucuk); padding:11px; font-weight:600; font-size:13px; background:var(--sari-yumusak); color:var(--sari); border:1.5px solid var(--sari); margin-bottom:10px; }
  .nav-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .nav-actions .btn-secondary { border-radius:var(--r-kucuk); padding:11px; font-weight:600; font-size:13px; background:var(--panel); color:var(--metin); border:1px solid var(--line); }
  .nav-actions .btn-secondary:disabled { opacity:0.35; }
  @keyframes cardEnter { from { opacity:0; transform:translateY(10px) scale(0.97); } to { opacity:1; transform:translateY(0) scale(1); } }
  .perspective, .mc-question { animation:cardEnter .38s cubic-bezier(.2,.8,.3,1); }
  .hint { text-align:center; font-size:12px; color:var(--sonuk); }
  .mc-question { background:var(--panel-acik); border:1px solid var(--line); border-radius:var(--r); padding:24px; margin-bottom:18px; display:flex; flex-direction:column; align-items:center; text-align:center; min-height:150px; justify-content:center; }
  .mc-question img { width:76px; height:76px; border-radius:var(--r-kucuk); object-fit:cover; margin-bottom:12px; }
  .mc-question p { font-family:'Fraunces',Georgia,serif; font-size:18px; font-weight:600; color:var(--metin); white-space:pre-wrap; word-break:break-word; }
  .mc-option { width:100%; text-align:left; white-space:pre-wrap; word-break:break-word; border-radius:var(--r-kucuk); padding:13px 16px; font-size:14px; font-weight:500; margin-bottom:9px; background:var(--panel); border:1.5px solid var(--line); color:var(--metin); }
  .progress-bar-outer { width:100%; height:4px; border-radius:var(--r-kucuk); background:var(--line); overflow:hidden; margin-bottom:20px; }
  .progress-bar-inner { height:100%; background:var(--mavi); }
  .undo-btn { font-size:12px; color:var(--sonuk); background:none; text-decoration:underline; display:block; margin:0 auto 16px; }
  .summary-icon { width:80px; height:80px; border-radius:50%; margin:0 auto 18px; background:var(--sari-yumusak); display:flex; align-items:center; justify-content:center; font-size:34px; }
  .stat-box { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px; text-align:center; }
  .stat-num { font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:700; }
  .empty-state { text-align:center; padding:40px 0; color:var(--sonuk); font-size:14px; }
  .setup-box { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:20px; margin-top:40px; line-height:1.6; font-size:14px; }
  .setup-box code { background:var(--panel-acik); padding:2px 6px; border-radius:var(--r-kucuk); font-family:'IBM Plex Mono',monospace; font-size:12.5px; }
  .setup-box ol { padding-left:20px; }
  .loading-screen { display:flex; align-items:center; justify-content:center; min-height:80vh; color:var(--sonuk); font-size:14px; }
  .user-stat-card { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:18px; margin-bottom:14px; }
  .user-stat-head { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .avatar { width:38px; height:38px; border-radius:50%; background:var(--panel-acik); display:flex; align-items:center; justify-content:center; font-weight:700; font-family:'Fraunces',Georgia,serif; color:var(--sari); flex-shrink:0; }
  .level-badge { font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--yesil-yumusak); color:var(--yesil); margin-left:auto; }
  .stat-mini-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .stat-mini { background:var(--panel-acik); border-radius:var(--r-kucuk); padding:10px; text-align:center; }
  .stat-mini .n { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:17px; }
  .stat-mini .l { font-size:10px; color:var(--sonuk); margin-top:2px; }
  .import-count { font-size:12px; color:var(--sonuk); margin:-8px 0 14px; }
  .curve-box { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px 12px 12px; margin-bottom:16px; }
  .curve-title { font-size:12px; color:var(--sonuk); font-weight:600; margin-bottom:12px; }
  .curve-row { display:flex; align-items:flex-end; gap:8px; height:64px; }
  .curve-col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .curve-count { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--metin); margin-bottom:4px; }
  .curve-bar { width:100%; border-radius:var(--r-kucuk) var(--r-kucuk) 0 0; min-height:4px; }
  .curve-labels { display:flex; gap:8px; margin-top:8px; }
  .curve-label { flex:1; text-align:center; font-size:9.5px; color:var(--sonuk); }
  .deck-title-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .backup-summary { background:var(--panel); border:1px solid var(--line); border-radius:var(--r-kucuk); padding:12px 14px; margin-bottom:14px; }
  .backup-summary-line { font-size:13px; font-weight:600; line-height:1.5; }
  .backup-summary-sub { font-size:11.5px; color:var(--sonuk); margin-top:4px; }
  .backup-divider { height:1px; background:var(--line); }
  .backup-preview { background:var(--panel); border:1px solid var(--yesil); border-radius:var(--r-kucuk); padding:12px 14px; }
  .backup-preview-title { font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--yesil); font-weight:700; margin-bottom:6px; }
  .backup-preview-line { font-size:12.5px; color:var(--metin); line-height:1.6; }
  .backup-preview-warn { font-size:12px; color:var(--sari); margin-top:8px; line-height:1.5; }
  .backup-error { background:var(--kirmizi-yumusak); border:1px solid var(--kirmizi); color:var(--kirmizi); border-radius:var(--r-kucuk); padding:10px 12px; font-size:12.5px; line-height:1.5; margin-bottom:12px; }
  .search-wrap { margin:18px 0 4px; }
  .search-wrap input { margin-bottom:0; }
  .search-wrap input::-webkit-search-cancel-button { filter:invert(1) opacity(0.5); }
  .search-count { font-size:11.5px; color:var(--mavi); margin:8px 2px 0; font-weight:600; }
  .search-divider { display:flex; align-items:center; gap:10px; margin:22px 0 14px; font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--sonuk); }
  .search-divider::before, .search-divider::after { content:""; flex:1; height:1px; background:var(--line); }
  .speak-btn { position:absolute; top:12px; right:12px; background:var(--line); border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:15px; padding:0; line-height:1; }

<script type="module">

// =========================================================================

const USERS = ["Onur", "Fatma"];

// Firebase config — Firebase konsolundan aldığın config'i buraya yapıştır.

if (NOT_CONFIGURED) {

const fbApp = initializeApp(firebaseConfig);

// Çevrimdışı kalıcılık: veriler tarayıcıda da saklanır. İnternet yokken
// uygulama açılmaya ve kart eklemeye devam eder; yapılan yazmalar kuyruğa

try {

  });
} catch (err) {
  // Gizli sekme / eski tarayıcı gibi kalıcılığın açılamadığı durumlarda

  db = getFirestore(fbApp); // varsa mevcut örneği döndürür, yoksa varsayılanı kurar
}
const decksCol = collection(db, "decks");
const cardsCol = collection(db, "cards");
const progressCol = collection(db, "progress");
const statsCol = collection(db, "stats");

// ---------- constants ----------
// Kutu başına tekrar aralığı (gün). Index = kutu numarası, 0 kullanılmıyor.
// Aralıklar kutu yükseldikçe artmalı: 5. kutu eskiden 3 gündü, yani ustalaşılan
// kart 4. kutudakinden (7 gün) daha sık geliyordu — düzeltildi.
const BOX_INTERVAL_DAYS = [0, 0, 1, 3, 7, 21];
const MAX_BOX = 5;
const MASTERED_SESSION_CAP = 5;
const PAUSED_SESSION_KEY = "flashcard-paused-session";
// Kart görseli: Firestore doküman sınırı 1MB olduğu için küçültülerek saklanır.
const IMAGE_MAX_SIDE = 480;
const IMAGE_QUALITY = 0.72;
const IMAGE_MAX_BYTES = 600 * 1024;

// ---------- helpers ----------
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
function daysAgoStr(n) { const d = new Date(); d.setDate(d.getDate() - n); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
function esc(s) { return (s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function progressKey(user, cardId) { return `${user}__${cardId}`; }
function isDueProgress(p) { if (!p || !p.nextReview) return true; return new Date(p.nextReview).getTime() <= Date.now(); }

function loadCurrentUser() {
  const saved = localStorage.getItem("flashcard-user");
  return USERS.includes(saved) ? saved : USERS[0];
}
function saveCurrentUser(u) { localStorage.setItem("flashcard-user", u); }

let lastVisibility = localStorage.getItem("flashcard-last-visibility") || "both";
function saveLastVisibility(v) { lastVisibility = v; localStorage.setItem("flashcard-last-visibility", v); }

// ---------- state ----------
let decks = [];
let cards = [];
let progressList = [];
let statsList = [];

const state = {
  view: "home", // home | deck | study | summary | stats
  currentUser: loadCurrentUser(),
  activeDeckId: null,
  showNewDeck: false,
  newDeckName: "",
  showCardForm: false,
  showImport: false,
  showExport: false,
  showBackup: false,
  restorePreview: null,   // seçilen yedek dosyasının okunmuş hali
  restoreError: null,
  restoreBusy: false,
  importText: "",
  editingCardId: null,
  formFront: "",
  formBack: "",
  formImage: null,        // kart görseli (data URI) veya null
  formImageBusy: false,
  formImageError: null,
  deckSearch: "",         // deste içi kart arama
  formVisibility: "both", // 'both' | user name
  focusFrontOnOpen: false,
  studyMode: "flip",
  studyOrder: localStorage.getItem("flashcard-study-order") || "shuffled", // 'shuffled' | 'sequential'
  queue: [],
  qIndex: 0,
  flipped: false,
  mcOptions: [],
  mcSelected: null,
  sessionCorrect: 0,
  sessionWrong: 0,
  sessionReviewed: 0, // istatistiğe henüz işlenmemiş tekrar sayısı
  lastAction: null, // for undo
  // sesli pratik
  practiceTurns: [],      // [{role, content}]
  practiceStatus: "idle", // idle | listening | thinking | replying | speaking
  practiceHeard: "",      // mikrofonun o an duyduğu
  practiceDraft: "",      // Claude'dan akan cevap
  practiceError: null,
  showPracticeSetup: false,
};

function modalOpen() { return state.showNewDeck || state.showCardForm || state.showImport || state.showExport || state.showBackup || state.showPracticeSetup; }
let pendingRender = false;
function maybeRender() {
  // Yedek modalında metin girişi yok; sayılar canlı kalsın diye yeniden çizilebilir.
  if (state.showBackup && !state.restoreBusy) { render(); return; }
  if (modalOpen()) pendingRender = true; else render();
}

// ---------- image resize ----------
// Seçilen görseli tarayıcıda küçültüp JPEG data URI'ye çevirir. Firestore
// dokümanı 1MB'ı aşamayacağı için orijinal dosya asla olduğu gibi saklanmaz.
function resizeImageFile(file) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith("image/")) { reject(new Error("Bu bir görsel dosyası değil.")); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Dosya okunamadı."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Görsel açılamadı."));
      img.onload = () => {
        const scale = Math.min(1, IMAGE_MAX_SIDE / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        let out = canvas.toDataURL("image/jpeg", IMAGE_QUALITY);
        // Hâlâ büyükse kaliteyi kademeli düşür.
        let q = IMAGE_QUALITY;
        while (out.length > IMAGE_MAX_BYTES && q > 0.3) {
          q -= 0.12;
          out = canvas.toDataURL("image/jpeg", q);
        }
        if (out.length > IMAGE_MAX_BYTES) { reject(new Error("Görsel çok büyük, daha küçük bir dosya seç.")); return; }
        resolve(out);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// ---------- sesli okuma ----------
// Türkçeye özgü harf varsa Türkçe, yoksa İngilizce sesle okur.
function guessLang(text) { return /[çğıöşüÇĞİÖŞÜ]/.test(text || "") ? "tr-TR" : "en-US"; }
function speak(text) {
  if (!("speechSynthesis" in window) || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = guessLang(text);
    const voice = speechSynthesis.getVoices().find((v) => v.lang === u.lang)
      || speechSynthesis.getVoices().find((v) => v.lang.startsWith(u.lang.slice(0, 2)));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  } catch (err) { console.warn("Sesli okuma başarısız:", err); }
}
const speechSupported = typeof window !== "undefined" && "speechSynthesis" in window;

// ---------- ses tanıma (konuşmayı metne çevirme) ----------
const SpeechRec = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
const recognitionSupported = !!SpeechRec;
let recognition = null;

// Mikrofonu açar. onResult(metin) duyulan cümleyle çağrılır.
function startListening(lang, onResult, onEnd, onError) {
  if (!SpeechRec) { onError && onError("Bu tarayıcı ses tanımayı desteklemiyor."); return null; }
  stopListening();
  const rec = new SpeechRec();
  rec.lang = lang;
  rec.interimResults = true;
  rec.continuous = false;
  let finalText = "";
  rec.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript;
      else interim += r[0].transcript;
    }
    onResult(finalText, interim);
  };
  rec.onerror = (e) => {
    // "aborted" bizim kendi durdurmamız; hata sayma.
    if (e.error !== "aborted") onError && onError(speechErrorText(e.error));
  };
  rec.onend = () => { recognition = null; onEnd && onEnd(finalText.trim()); };
  recognition = rec;
  try { rec.start(); } catch (err) { onError && onError(err.message); }
  return rec;
}
function stopListening() {
  if (recognition) { try { recognition.stop(); } catch {} recognition = null; }
}
function speechErrorText(code) {
  if (code === "not-allowed" || code === "service-not-allowed") return "Mikrofon izni verilmedi. Tarayıcı ayarlarından izin ver.";
  if (code === "no-speech") return "Ses duyulmadı, tekrar dene.";
  if (code === "network") return "Ses tanıma için internet gerekiyor.";
  if (code === "audio-capture") return "Mikrofon bulunamadı.";
  return "Ses tanıma hatası: " + code;
}

// Sesli okumanın bitmesini bekleyen sürüm — cevap bitmeden mikrofon açılmasın.
function speakAsync(text, lang) {
  return new Promise((resolve) => {
    if (!speechSupported || !text) { resolve(); return; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang || guessLang(text);
      const voice = speechSynthesis.getVoices().find((v) => v.lang === u.lang)
        || speechSynthesis.getVoices().find((v) => v.lang.startsWith(u.lang.slice(0, 2)));
      if (voice) u.voice = voice;
      u.onend = () => resolve();
      u.onerror = () => resolve();
      speechSynthesis.speak(u);
    } catch { resolve(); }
  });
}

// ---------- klavye ----------
// Kısayol ipuçları yalnızca fiziksel klavyesi olan cihazlarda gösterilsin.
const hasKeyboard = typeof window !== "undefined" && window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
function keyboardHint() { return hasKeyboard ? " · <b>Boşluk</b>" : ""; }

// ---------- progress / stats helpers ----------
function getProgress(cardId, user) {
  return progressList.find((p) => p.cardId === cardId && p.user === user) || { box: 1, nextReview: null, correctCount: 0, wrongCount: 0 };
}
function getStats(user) {
  return statsList.find((s) => s.id === user) || { streak: 0, lastStudyDate: null, totalReviewed: 0 };
}
function visibleCards(deckId, user) {
  return cards.filter((c) => c.deckId === deckId && (c.visibility === "both" || c.visibility === user));
}
// Kullanıcının görebildiği TÜM kartlar (deste farketmeksizin). İstatistikler
// eskiden `cards` dizisinin tamamını kullanıyordu; karşı tarafa özel kartlar
// da sayıma giriyordu.
function allVisibleCards(user) {
  return cards.filter((c) => c.visibility === "both" || c.visibility === user);
}
// Ekranda gösterilecek güncel seri. Kayıtlı streak yalnızca seans bitince
// güncellendiği için, aradan gün geçmişse ekranda bayat kalıyordu.
function currentStreak(user) {
  const s = getStats(user);
  if (!s.streak || !s.lastStudyDate) return 0;
  if (s.lastStudyDate === todayStr() || s.lastStudyDate === daysAgoStr(1)) return s.streak;
  return 0; // seri kopmuş
}
function masteredCountFor(user) {
  return progressList.filter((p) => p.user === user && p.box >= MAX_BOX).length;
}
function levelFor(masteredCount) {
  if (masteredCount < 15) return "Başlangıç";
  if (masteredCount < 60) return "Orta seviye";
  if (masteredCount < 150) return "İleri seviye";
  return "Usta";
}

const STAGE_DEFS = [
  { box: 1, label: "Yeni", color: "var(--kutu1)" },
  { box: 2, label: "Zayıf", color: "var(--kutu2)" },
  { box: 3, label: "Orta", color: "var(--kutu3)" },
  { box: 4, label: "İyi", color: "var(--kutu4)" },
  { box: 5, label: "Ustalaştı", color: "var(--kutu5)" },
];
function renderLearningCurve(cardList, user, title) {
  const counts = STAGE_DEFS.map((s) => cardList.filter((c) => getProgress(c.id, user).box === s.box).length);
  const max = Math.max(1, ...counts);
  return `
    <div class="curve-box">
      <div class="curve-title">${esc(title || "Öğrenme eğrisi")}</div>
      <div class="curve-row">
        ${STAGE_DEFS.map((s, i) => `
          <div class="curve-col">
            <div class="curve-count">${counts[i]}</div>
            <div class="curve-bar" style="height:${Math.max(6, Math.round((counts[i] / max) * 100))}%;background:${s.color};"></div>
          </div>`).join("")}
      </div>
      <div class="curve-labels">${STAGE_DEFS.map((s) => `<div class="curve-label" style="color:${s.color};">${esc(s.label)}</div>`).join("")}</div>
    </div>`;
}

// ---------- firestore CRUD ----------
async function createDeck() {
  if (!state.newDeckName.trim()) return;
  await addDoc(decksCol, { name: state.newDeckName.trim(), createdAt: Date.now() });
  state.newDeckName = ""; state.showNewDeck = false;
  pendingRender = false; render();
}

async function deleteDeck(deckId, deckName) {
  if (!confirm(`"${deckName}" destesini silmek istiyor musun? İçindeki tüm kartlar da silinecek.`)) return;
  const batch = writeBatch(db);
  batch.delete(doc(db, "decks", deckId));
  const deckCardIds = cards.filter((c) => c.deckId === deckId).map((c) => c.id);
  deckCardIds.forEach((id) => batch.delete(doc(db, "cards", id)));
  progressList.filter((p) => deckCardIds.includes(p.cardId)).forEach((p) => batch.delete(doc(db, "progress", p.id)));
  await batch.commit();
  const paused = loadPausedSession();
  if (paused && paused.deckId === deckId) clearPausedSession();
  if (state.activeDeckId === deckId) { state.view = "home"; state.activeDeckId = null; }
  render();
}

async function saveCardForm() {
  if (!state.formFront.trim() || !state.formBack.trim()) return;
  const payload = {
    deckId: state.activeDeckId,
    front: state.formFront.trim(),
    back: state.formBack.trim(),
    visibility: state.formVisibility,
    image: state.formImage || null,
  };
  const btn = document.getElementById("btn-save-card");
  if (btn) { btn.disabled = true; btn.textContent = "Kaydediliyor…"; }
  try {
    if (state.editingCardId) {
      await updateDoc(doc(db, "cards", state.editingCardId), payload);
      // eğer bu kart çalışma oturumundaki kuyrukta duruyorsa, orada da güncelle
      const qc = state.queue.find((c) => c.id === state.editingCardId);
      if (qc) Object.assign(qc, payload);
    } else {
      await addDoc(cardsCol, { ...payload, createdBy: state.currentUser, createdAt: Date.now() });
    }
    state.showCardForm = false; pendingRender = false; render();
  } catch (err) {
    console.error(err);
    alert("Kart kaydedilemedi: " + err.message + "\n\nİnternet bağlantını kontrol et ve tekrar dene.");
    if (btn) { btn.disabled = false; btn.textContent = "Kaydet"; }
  }
}

async function setBoxManually(cardId, box) {
  const user = state.currentUser;
  const key = progressKey(user, cardId);
  const existingDoc = progressList.find((p) => p.id === key);
  const cur = existingDoc || { correctCount: 0, wrongCount: 0 };
  const days = BOX_INTERVAL_DAYS[box] ?? 0;
  const d = new Date(); d.setDate(d.getDate() + days);
  const nextReview = days === 0 ? new Date().toISOString() : d.toISOString();
  const card = cards.find((c) => c.id === cardId);
  await setDoc(doc(db, "progress", key), {
    box, nextReview,
    correctCount: cur.correctCount || 0, wrongCount: cur.wrongCount || 0,
    user, cardId, deckId: card ? card.deckId : state.activeDeckId, updatedAt: Date.now(),
  }, { merge: false });
}

async function deleteCard(cardId) {
  await deleteDoc(doc(db, "cards", cardId));
  const relatedProgress = progressList.filter((p) => p.cardId === cardId);
  if (relatedProgress.length) {
    const batch = writeBatch(db);
    relatedProgress.forEach((p) => batch.delete(doc(db, "progress", p.id)));
    await batch.commit();
  }
}

// ---------- import ----------
// Satır sonundaki seviye alanı: "1.3" -> 1. kullanıcı 3. kutuda.
// Sonuna "+" gelirse (1.3+) içe aktarmada o kullanıcının kutusu 1 artırılır.
const LEVEL_TOKEN = /^(\d+)\.(\d+)(\+?)$/;

// Bir parçanın gerçekten seviye alanı olup olmadığını söyler.
// Sadece kalıba bakmak yetmez: "pi - 3.14" gibi bir kartın arka yüzü de
// kalıba uyar. Kullanıcı indeksi ve kutu numarası geçerli aralıkta olmalı.
function parseLevelToken(part) {
  const m = LEVEL_TOKEN.exec((part || "").trim());
  if (!m) return null;
  const userIndex = Number(m[1]);
  const box = Number(m[2]);
  if (userIndex < 1 || userIndex > USERS.length) return null;
  if (box < 1 || box > MAX_BOX) return null;
  return { user: USERS[userIndex - 1], box, bump: m[3] === "+" };
}

// Satırın sonundan en fazla USERS.length kadar seviye alanını soyar.
// Geriye kalan metni ve "+" işaretli kullanıcı adlarını döndürür.
function stripLevels(parts) {
  const bumps = [];
  const rest = parts.slice();
  // Sayaç soyulan parça sayısını tutmalı — bumps yalnızca "+" işaretlilerde
  // büyüdüğü için onu sınır olarak kullanmak işaretsiz seviyelerde sınırı
  // tamamen devre dışı bırakırdı.
  let stripped = 0;
  while (rest.length > 2 && stripped < USERS.length) {
    const level = parseLevelToken(rest[rest.length - 1]);
    if (!level) break;
    rest.pop();
    stripped++;
    if (level.bump) bumps.unshift(level.user);
  }
  return { rest, bumps };
}

function parseImportText(text) {
  const lines = text.split("\n");
  const pairs = [];
  for (const raw of lines) {
    const line = raw.replace(/\r$/, "");
    if (!line.trim()) continue;

    let front, back, bumps = [];
    if (line.includes("\t")) {
      const stripped = stripLevels(line.split("\t"));
      bumps = stripped.bumps;
      front = stripped.rest[0]; back = stripped.rest.slice(1).join(" ");
    } else if (line.includes(" - ")) {
      // Ön/arka yüz İLK ayırıcıdan bölünmeye devam ediyor (kart metninde
      // tire olabilir); seviyeler yalnızca sondan soyuluyor.
      const stripped = stripLevels(line.split(" - "));
      bumps = stripped.bumps;
      const remainder = stripped.rest.join(" - ");
      const idx = remainder.indexOf(" - ");
      if (idx === -1) continue;
      front = remainder.slice(0, idx); back = remainder.slice(idx + 3);
    } else if (line.includes("-")) {
      const idx = line.indexOf("-");
      front = line.slice(0, idx); back = line.slice(idx + 1);
    } else continue;

    front = unescapeCell((front || "").trim()); back = unescapeCell((back || "").trim());
    if (front && back) pairs.push({ front, back, bumps });
  }
  return pairs;
}
// Dışa/içe aktarma satır bazlı çalışır; kart metnindeki alt satırlar bu yüzden
// tek satıra "\n" olarak yazılır ve içe aktarırken geri açılır.
function escapeCell(text) {
  return (text || "").replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\n");
}
function unescapeCell(text) {
  return (text || "").replace(/\\(.)/g, (_, ch) => (ch === "n" ? "\n" : ch));
}

// Aynı kartın iki kez eklenmesini önlemek için karşılaştırma anahtarı.
function cardKey(front, back) {
  return `${(front || "").trim().toLocaleLowerCase("tr")}\u001f${(back || "").trim().toLocaleLowerCase("tr")}`;
}

// İçe aktarma öncesi özet — hem onay penceresinde hem de sonuç mesajında
// aynı sayıları kullanmak için tek yerden hesaplanır.
function summarizeImport(parsed) {
  const deckCards = cards.filter((c) => c.deckId === state.activeDeckId);
  const existing = new Map(deckCards.map((c) => [cardKey(c.front, c.back), c]));
  const seen = new Set(existing.keys());
  const fresh = [];
  let duplicates = 0;
  let bumpCount = 0;

  for (const row of parsed) {
    const key = cardKey(row.front, row.back);
    if (seen.has(key)) duplicates++;
    else { seen.add(key); fresh.push(row); }
    bumpCount += row.bumps.length;
  }
  return { fresh, duplicates, bumpCount, existing };
}

// "+" işaretli satırlar için ilerlemeyi bir kutu yukarı taşır.
// newCardIds: bu içe aktarmada oluşturulan kartların anahtar -> id eşlemesi.
async function applyImportBumps(parsed, existing, newCardIds) {
  // Aynı satır iki kez yapıştırılmışsa tek yazma yeterli — hem sayaç dürüst
  // kalır hem de kutu yanlışlıkla iki kez artmış gibi raporlanmaz.
  const writes = new Map();
  for (const row of parsed) {
    if (!row.bumps.length) continue;
    const key = cardKey(row.front, row.back);
    const card = existing.get(key);
    const cardId = card ? card.id : newCardIds.get(key);
    if (!cardId) continue;

    for (const user of row.bumps) {
      const progKey = progressKey(user, cardId);
      const cur = progressList.find((p) => p.id === progKey);
      const box = Math.min(MAX_BOX, (cur && cur.box ? cur.box : 1) + 1);
      const days = BOX_INTERVAL_DAYS[box] ?? 0;
      const d = new Date(); d.setDate(d.getDate() + days);
      if (writes.has(progKey)) continue;
      writes.set(progKey, {
        box,
        nextReview: days === 0 ? new Date().toISOString() : d.toISOString(),
        correctCount: (cur && cur.correctCount) || 0,
        wrongCount: (cur && cur.wrongCount) || 0,
        user, cardId, deckId: state.activeDeckId, updatedAt: Date.now(),
      });
    }
  }

  const entries = [...writes.entries()];
  for (let i = 0; i < entries.length; i += 400) {
    const batch = writeBatch(db);
    for (const [key, payload] of entries.slice(i, i + 400)) {
      batch.set(doc(db, "progress", key), payload, { merge: false });
    }
    await batch.commit();
  }
  return entries.length;
}

async function runImport() {
  const parsed = parseImportText(state.importText);
  if (parsed.length === 0) return;

  const { fresh, duplicates, existing } = summarizeImport(parsed);

  // Yeni kartlar. Seviye artırmada id gerektiği için id'ler önceden üretilir.
  const newCardIds = new Map();
  for (let i = 0; i < fresh.length; i += 400) {
    const batch = writeBatch(db);
    for (const row of fresh.slice(i, i + 400)) {
      const ref = doc(cardsCol);
      newCardIds.set(cardKey(row.front, row.back), ref.id);
      batch.set(ref, {
        deckId: state.activeDeckId, front: row.front, back: row.back,
        visibility: "both",
        createdBy: state.currentUser, createdAt: Date.now(),
      });
    }
    await batch.commit();
  }

  const bumped = await applyImportBumps(parsed, existing, newCardIds);

  state.showImport = false; state.importText = "";
  pendingRender = false; render();

  const parts = [];
  parts.push(fresh.length > 0 ? `${fresh.length} kart eklendi.` : "Yeni kart eklenmedi.");
  if (duplicates > 0) parts.push(`${duplicates} kart zaten bu destede vardı, yeniden eklenmedi — seviyeleri yine de uygulandı.`);
  parts.push(bumped > 0 ? `${bumped} seviye bir kutu yükseltildi.` : "Hiçbir seviye değişmedi (+ işareti yok).");
  alert(parts.join("\n"));
}

// =========================================================================
// YEDEK AL / GERİ YÜKLE
// Tüm Firestore verisini (desteler, kartlar, ilerleme, istatistikler) tek bir
// JSON dosyasına yazar ve aynı dosyadan geri yükler. Doküman id'leri korunur,
// böylece ilerleme kayıtları kartlarla eşleşmeye devam eder.
// =========================================================================
const BACKUP_FORMAT = "kart-kutusu-backup";
const BACKUP_VERSION = 1;
const LAST_BACKUP_KEY = "flashcard-last-backup";

function buildBackup() {
  return {
    format: BACKUP_FORMAT,
    version: BACKUP_VERSION,
    exportedAt: new Date().toISOString(),
    projectId: firebaseConfig.projectId,
    users: USERS,
    decks, cards,
    progress: progressList,
    stats: statsList,
  };
}

function downloadBackup() {
  const data = buildBackup();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  const a = document.createElement("a");
  a.href = url;
  a.download = `kart-kutusu-yedek-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  try { localStorage.setItem(LAST_BACKUP_KEY, new Date().toISOString()); } catch {}
  return data;
}

function lastBackupText() {
  try {
    const raw = localStorage.getItem(LAST_BACKUP_KEY);
    if (!raw) return null;
    const d = new Date(raw);
    if (isNaN(d)) return null;
    return d.toLocaleString("tr-TR", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });
  } catch { return null; }
}

// Yedek dosyasını doğrular; sorun varsa hata mesajı döner.
function validateBackup(data) {
  if (!data || typeof data !== "object") return "Dosya okunamadı.";
  if (data.format !== BACKUP_FORMAT) return "Bu bir Kart Kutusu yedek dosyası değil.";
  for (const key of ["decks", "cards", "progress", "stats"]) {
    if (!Array.isArray(data[key])) return `Yedek dosyası bozuk: "${key}" listesi yok.`;
  }
  const missingId = ["decks", "cards", "progress", "stats"].find((k) => data[k].some((r) => !r || typeof r.id !== "string" || !r.id));
  if (missingId) return `Yedek dosyası bozuk: "${missingId}" içindeki bazı kayıtların id'si yok.`;
  return null;
}

// Kayıtları 400'lük gruplar halinde, id'leri koruyarak geri yazar.
async function restoreCollection(colName, rows, onProgress) {
  for (let i = 0; i < rows.length; i += 400) {
    const batch = writeBatch(db);
    for (const row of rows.slice(i, i + 400)) {
      const { id, ...payload } = row;
      batch.set(doc(db, colName, id), payload, { merge: false });
    }
    await batch.commit();
    if (onProgress) onProgress(Math.min(i + 400, rows.length), rows.length);
  }
}

async function runRestore() {
  const data = state.restorePreview;
  if (!data || state.restoreBusy) return;

  const total = data.decks.length + data.cards.length + data.progress.length + data.stats.length;
  if (!confirm(
    `Yedekteki ${total} kayıt geri yüklenecek.\n\n` +
    `• Aynı id'ye sahip kayıtların üzerine yedekteki hali yazılır.\n` +
    `• Şu anda var olup yedekte olmayan hiçbir şey SİLİNMEZ.\n\n` +
    `Devam etmeden önce mevcut halin bir yedeği bilgisayarına indirilecek.`
  )) return;

  state.restoreBusy = true; state.restoreError = null; render();

  // Güvenlik ağı: geri yüklemeden önce mevcut halin yedeğini al.
  try { downloadBackup(); } catch (err) { console.error(err); }

  const btn = document.getElementById("btn-run-restore");
  const setLabel = (t) => { const b = document.getElementById("btn-run-restore"); if (b) b.textContent = t; };
  if (btn) btn.disabled = true;

  try {
    setLabel("Desteler yükleniyor…");
    await restoreCollection("decks", data.decks);
    setLabel("Kartlar yükleniyor…");
    await restoreCollection("cards", data.cards, (done, all) => setLabel(`Kartlar yükleniyor… ${done}/${all}`));
    setLabel("İlerleme yükleniyor…");
    await restoreCollection("progress", data.progress, (done, all) => setLabel(`İlerleme yükleniyor… ${done}/${all}`));
    setLabel("İstatistikler yükleniyor…");
    await restoreCollection("stats", data.stats);

    state.restoreBusy = false;
    state.restorePreview = null;
    state.showBackup = false;
    pendingRender = false; render();
    alert(`Geri yükleme tamamlandı. ${total} kayıt geri yüklendi.`);
  } catch (err) {
    console.error(err);
    state.restoreBusy = false;
    state.restoreError = "Geri yükleme başarısız: " + err.message;
    render();
  }
}

function handleBackupFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data = null;
    try { data = JSON.parse(reader.result); }
    catch { state.restorePreview = null; state.restoreError = "Dosya geçerli bir JSON değil."; render(); return; }
    const problem = validateBackup(data);
    if (problem) { state.restorePreview = null; state.restoreError = problem; render(); return; }
    state.restorePreview = data; state.restoreError = null; render();
  };
  reader.onerror = () => { state.restorePreview = null; state.restoreError = "Dosya okunamadı."; render(); };
  reader.readAsText(file);
}

// =========================================================================
// SESLİ PRATİK (Claude)
// Tarayıcı doğrudan Anthropic'e istek atamaz — API anahtarı herkese açık
// olurdu. İstekler worker/ altındaki Cloudflare Worker'a gider, anahtar
// orada durur. Kurulum: worker/README.md
// =========================================================================
const PRACTICE_URL_KEY = "flashcard-practice-url";
const PRACTICE_PASS_KEY = "flashcard-practice-pass";
const PRACTICE_LANG_KEY = "flashcard-practice-lang";

function practiceUrl() { try { return localStorage.getItem(PRACTICE_URL_KEY) || ""; } catch { return ""; } }
function practicePass() { try { return localStorage.getItem(PRACTICE_PASS_KEY) || ""; } catch { return ""; } }
function practiceConfigured() { return !!practiceUrl() && !!practicePass(); }
function savePracticeConfig(url, pass) {
  try {
    localStorage.setItem(PRACTICE_URL_KEY, url.trim().replace(/\/+$/, ""));
    localStorage.setItem(PRACTICE_PASS_KEY, pass);
  } catch {}
}
function practiceLang() { try { return localStorage.getItem(PRACTICE_LANG_KEY) || "en"; } catch { return "en"; } }
function savePracticeLang(l) { try { localStorage.setItem(PRACTICE_LANG_KEY, l); } catch {} }
function practiceLangTag() { return practiceLang() === "tr" ? "tr-TR" : "en-US"; }

// Worker'a bir tur gönderir, cevabı parça parça okur.
// onChunk her yeni metin parçasında çağrılır; tam metin döner.
async function askClaude(userText, history, onChunk) {
  const deck = decks.find((d) => d.id === state.activeDeckId);
  const dc = visibleCards(state.activeDeckId, state.currentUser);
  const res = await fetch(practiceUrl(), {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-App-Passphrase": practicePass() },
    body: JSON.stringify({
      message: userText,
      history: history.map((t) => ({ role: t.role, content: t.content })),
      deckName: deck ? deck.name : "deste",
      cards: dc.map((c) => ({ front: c.front, back: c.back })),
      lang: practiceLang(),
    }),
  });

  if (!res.ok) {
    let msg = "Sunucu hatası (" + res.status + ")";
    try { const j = await res.json(); if (j && j.error) msg = j.error; } catch {}
    throw new Error(msg);
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let full = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    const piece = decoder.decode(value, { stream: true });
    full += piece;
    onChunk(full);
  }
  return full.trim();
}

function startPractice() {
  state.practiceTurns = [];
  state.practiceStatus = "idle";
  state.practiceError = null;
  state.practiceHeard = "";
  state.practiceDraft = "";
  state.view = "practice";
  render();
}

function endPractice() {
  stopListening();
  if (speechSupported) { try { speechSynthesis.cancel(); } catch {} }
  state.practiceStatus = "idle";
  state.view = "deck";
  render();
}

// Mikrofonu aç → duyulanı Claude'a gönder → cevabı seslendir.
function practiceListen() {
  if (state.practiceStatus !== "idle") return;
  state.practiceError = null;
  state.practiceHeard = "";
  state.practiceStatus = "listening";
  render();

  startListening(
    practiceLangTag(),
    (finalText, interim) => {
      state.practiceHeard = (finalText + " " + interim).trim();
      updatePracticeLive();
    },
    (finalText) => {
      if (!finalText) {
        state.practiceStatus = "idle";
        state.practiceHeard = "";
        render();
        return;
      }
      practiceSend(finalText);
    },
    (msg) => {
      state.practiceError = msg;
      state.practiceStatus = "idle";
      render();
    }
  );
}

async function practiceSend(userText) {
  // Geçmiş, bu mesaj eklenmeden önceki hali olmalı — yoksa kullanıcının
  // cümlesi Claude'a hem `history` hem `message` içinde iki kez gider.
  const history = state.practiceTurns.slice();
  state.practiceTurns.push({ role: "user", content: userText });
  state.practiceHeard = "";
  state.practiceDraft = "";
  state.practiceStatus = "thinking";
  render();

  try {
    const reply = await askClaude(userText, history, (partial) => {
      state.practiceDraft = partial;
      if (state.practiceStatus === "thinking") { state.practiceStatus = "replying"; render(); }
      else updatePracticeLive();
    });
    state.practiceDraft = "";
    state.practiceTurns.push({ role: "assistant", content: reply });
    state.practiceStatus = "speaking";
    render();
    await speakAsync(reply, practiceLangTag());
    // Kullanıcı bu sırada ekrandan çıkmış olabilir.
    if (state.view === "practice") { state.practiceStatus = "idle"; render(); }
  } catch (err) {
    state.practiceDraft = "";
    state.practiceError = err.message;
    state.practiceStatus = "idle";
    render();
  }
}

// Akış sırasında tüm ekranı yeniden çizmemek için yalnızca canlı balonu güncelle.
function updatePracticeLive() {
  const el = document.getElementById("practice-live");
  if (!el) { render(); return; }
  el.textContent = state.practiceStatus === "listening" ? state.practiceHeard : state.practiceDraft;
  const scroller = document.getElementById("practice-scroll");
  if (scroller) scroller.scrollTop = scroller.scrollHeight;
}

// ---------- realtime listeners ----------
// Yedek alırken eksik veri yazmamak için her koleksiyonun en az bir kez
// yüklendiğini takip ediyoruz.
const loaded = { decks: false, cards: false, progress: false, stats: false };
function allLoaded() { return loaded.decks && loaded.cards && loaded.progress && loaded.stats; }

onSnapshot(decksCol, (snap) => { decks = snap.docs.map((d) => ({ id: d.id, ...d.data() })); loaded.decks = true; maybeRender(); }, (e) => console.error(e));
onSnapshot(cardsCol, (snap) => { cards = snap.docs.map((d) => ({ id: d.id, ...d.data() })); loaded.cards = true; maybeRender(); }, (e) => console.error(e));
onSnapshot(progressCol, (snap) => { progressList = snap.docs.map((d) => ({ id: d.id, ...d.data() })); loaded.progress = true; maybeRender(); }, (e) => console.error(e));
onSnapshot(statsCol, (snap) => { statsList = snap.docs.map((d) => ({ id: d.id, ...d.data() })); loaded.stats = true; maybeRender(); }, (e) => console.error(e));

// ---------- study session ----------
function buildMcOptions(card) {
  if (!card) return [];
  const pool = visibleCards(card.deckId, state.currentUser);
  const others = pool.filter((c) => c.id !== card.id && c.back.trim() !== card.back.trim());
  const shuffled = [...others].sort(() => Math.random() - 0.5).slice(0, 3);
  return [...shuffled.map((c) => c.back), card.back].sort(() => Math.random() - 0.5);
}
function deckSupportsMc(deckId, user) {
  const dc = visibleCards(deckId, user);
  const distinctBacks = new Set(dc.map((c) => c.back.trim()));
  return dc.length >= 2 && distinctBacks.size >= 2;
}
function dueCardsCapped(pool, user) {
  const due = pool.filter((c) => isDueProgress(getProgress(c.id, user)));
  const mastered = due.filter((c) => getProgress(c.id, user).box === MAX_BOX);
  const others = due.filter((c) => getProgress(c.id, user).box !== MAX_BOX);
  if (mastered.length > MASTERED_SESSION_CAP) {
    mastered.sort((a, b) => {
      const pa = getProgress(a.id, user).nextReview || "";
      const pb = getProgress(b.id, user).nextReview || "";
      return pa.localeCompare(pb);
    });
    return [...others, ...mastered.slice(0, MASTERED_SESSION_CAP)];
  }
  return [...others, ...mastered];
}
function startStudy(mode, all) {
  const pool = visibleCards(state.activeDeckId, state.currentUser);
  let due = all ? pool : dueCardsCapped(pool, state.currentUser);
  if (due.length === 0) due = pool;
  if (due.length === 0) return;
  state.queue = state.studyOrder === "sequential"
    ? [...due].sort((a, b) => a.front.localeCompare(b.front, "tr"))
    : [...due].sort(() => Math.random() - 0.5);
  commitSessionStats(); // önceki seanstan işlenmemiş tekrar kaldıysa yaz
  state.qIndex = 0; state.flipped = false;
  state.sessionCorrect = 0; state.sessionWrong = 0; state.sessionReviewed = 0;
  state.studyMode = mode; state.mcSelected = null; state.lastAction = null;
  if (mode === "mc") state.mcOptions = buildMcOptions(state.queue[0]);
  state.view = "study"; render();
}
function advanceQueue() {
  const next = state.qIndex + 1;
  if (next >= state.queue.length) { finishSession(); return; }
  state.qIndex = next; state.flipped = false; state.mcSelected = null;
  if (state.studyMode === "mc") state.mcOptions = buildMcOptions(state.queue[next]);
  render();
}

// ---------- pause / resume a study session ----------
function saveSessionSnapshot() {
  if (state.view !== "study" || !state.queue.length) return;
  const snap = {
    deckId: state.activeDeckId, user: state.currentUser, mode: state.studyMode,
    cardIds: state.queue.map((c) => c.id), qIndex: state.qIndex,
    sessionCorrect: state.sessionCorrect, sessionWrong: state.sessionWrong, savedAt: Date.now(),
  };
  localStorage.setItem(PAUSED_SESSION_KEY, JSON.stringify(snap));
}
function loadPausedSession() {
  try {
    const raw = localStorage.getItem(PAUSED_SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function clearPausedSession() { localStorage.removeItem(PAUSED_SESSION_KEY); }
function resumeSession() {
  const snap = loadPausedSession();
  if (!snap) return;
  const restoredQueue = snap.cardIds.map((id) => cards.find((c) => c.id === id)).filter(Boolean);
  if (restoredQueue.length === 0) { clearPausedSession(); return; }
  state.queue = restoredQueue;
  state.qIndex = Math.min(snap.qIndex, restoredQueue.length - 1);
  state.studyMode = snap.mode;
  state.sessionCorrect = snap.sessionCorrect || 0;
  state.sessionWrong = snap.sessionWrong || 0;
  state.sessionReviewed = 0; // duraklatırken zaten istatistiğe işlenmişti
  state.flipped = false; state.mcSelected = null; state.lastAction = null;
  if (state.studyMode === "mc") state.mcOptions = buildMcOptions(state.queue[state.qIndex]);
  state.view = "study"; render();
}
function stopSession() {
  saveSessionSnapshot();
  commitSessionStats();   // yarım seansta yapılan tekrarlar da sayılsın
  state.view = "deck"; render();
}
function deleteStudyCard() {
  const card = state.queue[state.qIndex];
  if (!card) return;
  if (!confirm(`"${card.front}" kartını silmek istiyor musun?`)) return;
  deleteCard(card.id);
  state.queue.splice(state.qIndex, 1);
  state.flipped = false; state.mcSelected = null;
  if (state.queue.length === 0) { clearPausedSession(); state.view = "deck"; render(); return; }
  if (state.qIndex >= state.queue.length) state.qIndex = state.queue.length - 1;
  if (state.studyMode === "mc") state.mcOptions = buildMcOptions(state.queue[state.qIndex]);
  render();
}

// Seansta gerçekten yapılan tekrarları istatistiğe işler. Seans yarıda
// kesilse de çağrılır; iki kez çağrılırsa ikincisi sayaç sıfırlandığı için
// bir şey yapmaz.
async function commitSessionStats() {
  const reviewed = state.sessionReviewed;
  if (reviewed <= 0) return;
  state.sessionReviewed = 0;
  const s = getStats(state.currentUser);
  const today = todayStr();
  const updated = { ...s };
  delete updated.id;
  if (updated.lastStudyDate !== today) {
    updated.streak = updated.lastStudyDate === daysAgoStr(1) ? (updated.streak || 0) + 1 : 1;
    updated.lastStudyDate = today;
  }
  updated.totalReviewed = (updated.totalReviewed || 0) + reviewed;
  try {
    await setDoc(doc(db, "stats", state.currentUser), updated, { merge: true });
  } catch (err) {
    console.error(err);
    state.sessionReviewed = reviewed; // yazılamadıysa kaybetme, sonra tekrar denenir
  }
}

async function finishSession() {
  clearPausedSession();
  await commitSessionStats();
  state.view = "summary"; render();
}

// action: 'wrong' | 'know' | 'master'
async function applyReview(card, action) {
  const user = state.currentUser;
  const key = progressKey(user, card.id);
  const existingDoc = progressList.find((p) => p.id === key);
  const prev = existingDoc ? { ...existingDoc } : null;
  const cur = prev || { box: 1, nextReview: null, correctCount: 0, wrongCount: 0 };

  let box = cur.box, nextReview, correctDelta = 0, wrongDelta = 0;
  if (action === "wrong") {
    // En fazla 2. seviyeye iner ama ASLA yükselmez: eskiden kutu 1'deki yeni
    // bir kartı bilememek onu kutu 2'ye terfi ettirip yarına erteliyordu.
    box = Math.min(cur.box || 1, 2);
    const days = BOX_INTERVAL_DAYS[box] ?? 1;
    const d = new Date(); d.setDate(d.getDate() + days);
    nextReview = days === 0 ? new Date().toISOString() : d.toISOString();
    wrongDelta = 1;
  } else if (action === "know") {
    box = Math.min(MAX_BOX, cur.box + 1);
    const days = BOX_INTERVAL_DAYS[box] ?? 0;
    const d = new Date(); d.setDate(d.getDate() + days);
    nextReview = days === 0 ? new Date().toISOString() : d.toISOString();
    correctDelta = 1;
  } else if (action === "master") {
    box = MAX_BOX;
    const days = BOX_INTERVAL_DAYS[MAX_BOX] ?? 0;
    const d = new Date(); d.setDate(d.getDate() + days);
    nextReview = d.toISOString();
    correctDelta = 1;
  }
  const next = { box, nextReview, correctCount: (cur.correctCount || 0) + correctDelta, wrongCount: (cur.wrongCount || 0) + wrongDelta, user, cardId: card.id, deckId: card.deckId, updatedAt: Date.now() };

  state.lastAction = { key, prevExisted: !!existingDoc, prevData: prev, queueIndex: state.qIndex, correctDelta, wrongDelta };
  await setDoc(doc(db, "progress", key), next, { merge: false });
  if (action === "wrong") state.sessionWrong++; else state.sessionCorrect++;
  state.sessionReviewed++;
}

async function undoLastAction() {
  const a = state.lastAction;
  if (!a) return;
  if (a.prevExisted) await setDoc(doc(db, "progress", a.key), a.prevData, { merge: false });
  else await deleteDoc(doc(db, "progress", a.key));
  state.qIndex = a.queueIndex;
  state.sessionCorrect -= a.correctDelta;
  state.sessionWrong -= a.wrongDelta;
  if (state.sessionReviewed > 0) state.sessionReviewed--;
  state.flipped = false; state.mcSelected = null;
  if (state.studyMode === "mc") state.mcOptions = buildMcOptions(state.queue[state.qIndex]);
  state.lastAction = null;
  render();
}

function handleFlipAnswer(action) {
  const card = state.queue[state.qIndex];
  applyReview(card, action).then(() => advanceQueue());
}
function goToPreviousCard() {
  if (state.qIndex === 0) return;
  state.qIndex--;
  state.flipped = false; state.mcSelected = null;
  if (state.studyMode === "mc") state.mcOptions = buildMcOptions(state.queue[state.qIndex]);
  render();
}
function handleMcSelect(option) {
  if (state.mcSelected !== null) return;
  state.mcSelected = option;
  const card = state.queue[state.qIndex];
  // Gözle aynı görünen iki şık (ör. sondaki boşluk farkı) yanlış sayılmasın.
  const correct = option.trim() === card.back.trim();
  applyReview(card, correct ? "know" : "wrong").then(() => render());
}

// Deste içi arama. Bilerek yeniden çizim yapmıyor — her tuş vuruşunda render
// edilseydi arama kutusu odağı ve imleci kaybederdi. Bunun yerine satırlar
// doğrudan gizlenip gösteriliyor, başlık sayıları da buna göre güncelleniyor.
function applyCardSearch() {
  const list = document.getElementById("card-list");
  if (!list) return;

  // İlk çağrıda özgün sıra saklanır; arama temizlenince buna geri dönülür.
  if (!list.__originalOrder) list.__originalOrder = [...list.children];
  const original = list.__originalOrder;

  const q = state.deckSearch.trim().toLocaleLowerCase("tr");
  const countEl = document.getElementById("search-count");

  // Arama yoksa her şey özgün haline döner.
  if (!q) {
    for (const el of original) { el.hidden = false; list.appendChild(el); }
    const divider = document.getElementById("search-divider");
    if (divider) divider.remove();
    if (countEl) { countEl.hidden = true; countEl.textContent = ""; }
    return;
  }

  const matches = [];
  const rest = [];
  for (const el of original) {
    if (!el.hasAttribute("data-card-row")) {
      // Aşama başlıkları arama sırasında gizlenir; kartlar gruplarından
      // çıkıp yukarı taşındığı için başlıklar artık doğru bilgi vermiyor.
      el.hidden = true;
      rest.push(el);
      continue;
    }
    el.hidden = false;
    ((el.dataset.searchText || "").includes(q) ? matches : rest).push(el);
  }

  // Eşleşenler üste, sonra ayırıcı, sonra geri kalan her şey özgün sırasıyla.
  for (const el of matches) list.appendChild(el);

  let divider = document.getElementById("search-divider");
  if (!divider) {
    divider = document.createElement("div");
    divider.id = "search-divider";
    divider.className = "search-divider";
  }
  divider.textContent = matches.length ? "diğer kartlar" : "eşleşme yok — tüm kartlar";
  list.appendChild(divider);

  for (const el of rest) list.appendChild(el);

  if (countEl) {
    countEl.hidden = false;
    countEl.textContent = matches.length
      ? `${matches.length} kart eşleşti, en üste alındı`
      : "Eşleşen kart yok";
  }
}

function renderExportModal() {

  const text = dc.map((c) => {
    const levels = USERS.map((u, i) => `${i + 1}.${getProgress(c.id, u).box}`).join(" - ");
    return `${escapeCell(c.front)} - ${escapeCell(c.back)} - ${levels}`;
  }).join("\n");
  return `

            o kartların kutusu bir üste çıkar. <b>+ konmayan sayılar hiçbir şeyi

// EVENTS

function bindEvents() {
  document.querySelectorAll("[data-select-user]").forEach((el) => {
    el.onclick = () => { state.currentUser = el.dataset.selectUser; saveCurrentUser(state.currentUser); render(); };
  });

  const btnNavStats = document.getElementById("btn-nav-stats");
  if (btnNavStats) btnNavStats.onclick = () => { state.view = "stats"; render(); };

  const btnNavBackup = document.getElementById("btn-nav-backup");
  if (btnNavBackup) btnNavBackup.onclick = () => {
    state.restorePreview = null; state.restoreError = null; state.restoreBusy = false;
    state.showBackup = true; render();
  };

  const btnNewDeck = document.getElementById("btn-new-deck");
  if (btnNewDeck) btnNewDeck.onclick = () => { state.showNewDeck = true; render(); };

  document.querySelectorAll("[data-open-deck]").forEach((el) => {
    el.onclick = () => { state.activeDeckId = el.dataset.openDeck; state.view = "deck"; render(); };
  });

  const btnBack = document.getElementById("btn-back-home");
  if (btnBack) btnBack.onclick = () => { state.view = "home"; render(); };

  const btnDeleteDeck = document.getElementById("btn-delete-deck");
  if (btnDeleteDeck) btnDeleteDeck.onclick = () => {
    const deck = decks.find((d) => d.id === state.activeDeckId);
    if (deck) deleteDeck(deck.id, deck.name);
  };

  const btnStudyFlip = document.getElementById("btn-study-flip");
  if (btnStudyFlip) btnStudyFlip.onclick = () => startStudy("flip", false);
  const btnStudyMc = document.getElementById("btn-study-mc");
  if (btnStudyMc) btnStudyMc.onclick = () => startStudy("mc", false);
  const btnStudyAll = document.getElementById("btn-study-all");
  if (btnStudyAll) btnStudyAll.onclick = () => startStudy("flip", true);
  const btnResumeSession = document.getElementById("btn-resume-session");
  if (btnResumeSession) btnResumeSession.onclick = resumeSession;
  document.querySelectorAll("[data-set-order]").forEach((el) => {
    el.onclick = () => { state.studyOrder = el.dataset.setOrder; localStorage.setItem("flashcard-study-order", state.studyOrder); render(); };
  });
  document.querySelectorAll("[data-set-box]").forEach((el) => {
    el.onclick = (e) => { e.stopPropagation(); setBoxManually(el.dataset.setBox, Number(el.dataset.boxVal)); };
  });

  const btnAddCard = document.getElementById("btn-add-card");
  if (btnAddCard) btnAddCard.onclick = () => {
    state.editingCardId = null;
    state.formFront = ""; state.formBack = ""; state.formVisibility = lastVisibility;
    state.formImage = null; state.formImageError = null; state.formImageBusy = false;
    state.focusFrontOnOpen = true;
    state.showCardForm = true; render();
  };
  // ---- kart arama ----
  const inputCardSearch = document.getElementById("input-card-search");
  if (inputCardSearch) {
    inputCardSearch.oninput = () => { state.deckSearch = inputCardSearch.value; applyCardSearch(); };
    inputCardSearch.onsearch = () => { state.deckSearch = inputCardSearch.value; applyCardSearch(); };
  }

  // ---- kart görseli ----
  const inputCardImage = document.getElementById("input-card-image");
  const btnPickImage = document.getElementById("btn-pick-image");
  if (btnPickImage && inputCardImage) btnPickImage.onclick = () => inputCardImage.click();
  if (inputCardImage) inputCardImage.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    state.formImageBusy = true; state.formImageError = null; render();
    try {
      state.formImage = await resizeImageFile(file);
    } catch (err) {
      state.formImageError = err.message;
    }
    state.formImageBusy = false; render();
  };
  const btnRemoveImage = document.getElementById("btn-remove-image");
  if (btnRemoveImage) btnRemoveImage.onclick = () => { state.formImage = null; state.formImageError = null; render(); };

  // ---- sesli okuma ----
  document.querySelectorAll("[data-speak]").forEach((el) => {
    el.onclick = (e) => { e.stopPropagation(); speak(el.dataset.speak); };
  });

  const btnOpenImport = document.getElementById("btn-open-import");
  if (btnOpenImport) btnOpenImport.onclick = () => { state.importText = ""; state.showImport = true; render(); };
  const btnOpenExport = document.getElementById("btn-open-export");
  if (btnOpenExport) btnOpenExport.onclick = () => { state.showExport = true; render(); };

  document.querySelectorAll("[data-edit-card]").forEach((el) => {
    el.onclick = () => {
      const c = cards.find((x) => x.id === el.dataset.editCard);
      if (!c) return;
      state.editingCardId = c.id;
      state.formFront = c.front; state.formBack = c.back;
      state.formVisibility = c.visibility || "both";
      state.formImage = c.image || null; state.formImageError = null; state.formImageBusy = false;
      state.focusFrontOnOpen = false;
      state.showCardForm = true; render();
    };
  });
  document.querySelectorAll("[data-delete-card]").forEach((el) => {
    el.onclick = () => {
      const c = cards.find((x) => x.id === el.dataset.deleteCard);
      if (!c) return;
      // Kart ve ona bağlı tüm ilerleme kalıcı olarak silinir — önce sor.
      if (!confirm(`"${c.front}" kartını silmek istiyor musun?\n\nBu kartın ilerlemesi de silinecek ve geri alınamaz.`)) return;
      deleteCard(c.id);
    };
  });

  const overlayNewDeck = document.getElementById("overlay-new-deck");
  if (overlayNewDeck) overlayNewDeck.onclick = (e) => { if (e.target === overlayNewDeck) { state.showNewDeck = false; render(); } };
  const closeNewDeck = document.getElementById("close-new-deck");
  if (closeNewDeck) closeNewDeck.onclick = () => { state.showNewDeck = false; render(); };
  const inputDeckName = document.getElementById("input-deck-name");
  if (inputDeckName) {
    inputDeckName.focus(); inputDeckName.selectionStart = inputDeckName.value.length;
    inputDeckName.oninput = (e) => { state.newDeckName = e.target.value; };
    inputDeckName.onkeydown = (e) => { if (e.key === "Enter") createDeck(); };
  }
  const btnCreateDeck = document.getElementById("btn-create-deck");
  if (btnCreateDeck) btnCreateDeck.onclick = createDeck;

  const overlayCardForm = document.getElementById("overlay-card-form");
  if (overlayCardForm) overlayCardForm.onclick = (e) => { if (e.target === overlayCardForm) { state.showCardForm = false; render(); } };
  const closeCardForm = document.getElementById("close-card-form");
  if (closeCardForm) closeCardForm.onclick = () => { state.showCardForm = false; render(); };

  document.querySelectorAll("[data-set-vis]").forEach((el) => { el.onclick = () => { state.formVisibility = el.dataset.setVis; saveLastVisibility(state.formVisibility); render(); }; });

  function autoGrow(el) { el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 260) + "px"; }

  const inputFront = document.getElementById("input-front");
  if (inputFront) {
    autoGrow(inputFront);
    inputFront.oninput = (e) => { state.formFront = e.target.value; autoGrow(inputFront); };
    if (state.focusFrontOnOpen) { inputFront.focus(); state.focusFrontOnOpen = false; }
  }
  const inputBack = document.getElementById("input-back");
  if (inputBack) {
    autoGrow(inputBack);
    inputBack.oninput = (e) => { state.formBack = e.target.value; autoGrow(inputBack); };
  }

  const btnSaveCard = document.getElementById("btn-save-card");
  if (btnSaveCard) btnSaveCard.onclick = saveCardForm;

  const overlayImport = document.getElementById("overlay-import");
  if (overlayImport) overlayImport.onclick = (e) => { if (e.target === overlayImport) { state.showImport = false; render(); } };
  const closeImport = document.getElementById("close-import");
  if (closeImport) closeImport.onclick = () => { state.showImport = false; render(); };
  const inputImport = document.getElementById("input-import");
  if (inputImport) { inputImport.focus(); inputImport.oninput = (e) => { state.importText = e.target.value; render(); }; }
  const btnRunImport = document.getElementById("btn-run-import");
  if (btnRunImport) btnRunImport.onclick = runImport;

  const overlayExport = document.getElementById("overlay-export");
  if (overlayExport) overlayExport.onclick = (e) => { if (e.target === overlayExport) { state.showExport = false; render(); } };
  const closeExport = document.getElementById("close-export");
  if (closeExport) closeExport.onclick = () => { state.showExport = false; render(); };
  const btnCopyExport = document.getElementById("btn-copy-export");
  if (btnCopyExport) btnCopyExport.onclick = async () => {
    const ta = document.getElementById("export-text");
    try {
      await navigator.clipboard.writeText(ta.value);
      const prev = btnCopyExport.textContent;
      btnCopyExport.textContent = "✓ Kopyalandı";
      setTimeout(() => { btnCopyExport.textContent = prev; }, 1500);
    } catch (err) {
      ta.select();
      document.execCommand("copy");
    }
  };

  // ---- yedek modalı ----
  const closeBackupModal = () => {
    if (state.restoreBusy) return;   // geri yükleme sürerken kapatma
    state.showBackup = false; state.restorePreview = null; state.restoreError = null; render();
  };
  const overlayBackup = document.getElementById("overlay-backup");
  if (overlayBackup) overlayBackup.onclick = (e) => { if (e.target === overlayBackup) closeBackupModal(); };
  const closeBackup = document.getElementById("close-backup");
  if (closeBackup) closeBackup.onclick = closeBackupModal;

  const btnDownloadBackup = document.getElementById("btn-download-backup");
  if (btnDownloadBackup) btnDownloadBackup.onclick = () => {
    downloadBackup();
    btnDownloadBackup.textContent = "✓ İndirildi";
    setTimeout(() => { const b = document.getElementById("btn-download-backup"); if (b) b.textContent = "⇩ Yedek dosyasını indir"; }, 1800);
  };

  const inputBackupFile = document.getElementById("input-backup-file");
  const btnPickBackup = document.getElementById("btn-pick-backup");
  if (btnPickBackup && inputBackupFile) btnPickBackup.onclick = () => inputBackupFile.click();
  if (inputBackupFile) inputBackupFile.onchange = (e) => handleBackupFile(e.target.files[0]);

  const btnRunRestore = document.getElementById("btn-run-restore");
  if (btnRunRestore) btnRunRestore.onclick = runRestore;

  // ---- sesli pratik ----
  const btnPractice = document.getElementById("btn-practice");
  if (btnPractice) btnPractice.onclick = () => {
    if (!recognitionSupported) {
      alert("Bu tarayıcı ses tanımayı desteklemiyor.\n\nAndroid'de Chrome, iPhone'da Safari dene.");
      return;
    }
    // Sunucu henüz tanımlı değilse önce kurulum penceresini aç.
    if (!practiceConfigured()) { state.showPracticeSetup = true; render(); return; }
    startPractice();
  };

  const btnPracticeExit = document.getElementById("btn-practice-exit");
  if (btnPracticeExit) btnPracticeExit.onclick = endPractice;

  const btnPracticeSettings = document.getElementById("btn-practice-settings");
  if (btnPracticeSettings) btnPracticeSettings.onclick = () => { state.showPracticeSetup = true; render(); };

  const btnMic = document.getElementById("btn-mic");
  if (btnMic) btnMic.onclick = () => {
    if (state.practiceStatus === "listening") stopListening();
    else practiceListen();
  };

  document.querySelectorAll("[data-practice-lang]").forEach((el) => {
    el.onclick = () => { savePracticeLang(el.dataset.practiceLang); render(); };
  });

  const overlayPracticeSetup = document.getElementById("overlay-practice-setup");
  const closePracticeSetup = () => { state.showPracticeSetup = false; pendingRender = false; render(); };
  if (overlayPracticeSetup) overlayPracticeSetup.onclick = (e) => { if (e.target === overlayPracticeSetup) closePracticeSetup(); };
  const closePracticeSetupBtn = document.getElementById("close-practice-setup");
  if (closePracticeSetupBtn) closePracticeSetupBtn.onclick = closePracticeSetup;

  const btnSavePracticeSetup = document.getElementById("btn-save-practice-setup");
  if (btnSavePracticeSetup) btnSavePracticeSetup.onclick = () => {
    const url = (document.getElementById("input-practice-url") || {}).value || "";
    const pass = (document.getElementById("input-practice-pass") || {}).value || "";
    if (!url.trim() || !pass) { alert("Adres ve parola gerekli."); return; }
    savePracticeConfig(url, pass);
    state.showPracticeSetup = false;
    pendingRender = false;
    if (state.view === "practice") render(); else startPractice();
  };

  const btnExitStudy = document.getElementById("btn-exit-study");
  if (btnExitStudy) btnExitStudy.onclick = () => { commitSessionStats(); state.view = "deck"; render(); };
  const btnStopStudy = document.getElementById("btn-stop-study");
  if (btnStopStudy) btnStopStudy.onclick = stopSession;
  const btnDeleteStudyCard = document.getElementById("btn-delete-study-card");
  if (btnDeleteStudyCard) btnDeleteStudyCard.onclick = deleteStudyCard;
  const btnEditStudyCard = document.getElementById("btn-edit-study-card");
  if (btnEditStudyCard) btnEditStudyCard.onclick = () => {
    const c = state.queue[state.qIndex];
    if (!c) return;
    state.editingCardId = c.id;
    state.formFront = c.front; state.formBack = c.back;
    state.formVisibility = c.visibility || "both";
    state.formImage = c.image || null; state.formImageError = null; state.formImageBusy = false;
    state.focusFrontOnOpen = false;
    state.showCardForm = true; render();
  };
  const flipCard = document.getElementById("flip-card");
  if (flipCard) flipCard.onclick = () => { state.flipped = !state.flipped; render(); };
  const btnWrong = document.getElementById("btn-wrong");
  if (btnWrong) btnWrong.onclick = () => handleFlipAnswer("wrong");
  const btnKnow = document.getElementById("btn-know");
  if (btnKnow) btnKnow.onclick = () => handleFlipAnswer("know");
  const btnMaster = document.getElementById("btn-master");
  if (btnMaster) btnMaster.onclick = () => handleFlipAnswer("master");
  const btnPrevCard = document.getElementById("btn-prev-card");
  if (btnPrevCard) btnPrevCard.onclick = goToPreviousCard;
  const btnUndo = document.getElementById("btn-undo");
  if (btnUndo) btnUndo.onclick = undoLastAction;
  document.querySelectorAll("[data-mc-option]").forEach((el) => { el.onclick = () => handleMcSelect(el.dataset.mcOption); });
  const btnMcNext = document.getElementById("btn-mc-next");
  if (btnMcNext) btnMcNext.onclick = advanceQueue;

  const btnSummaryDone = document.getElementById("btn-summary-done");
  if (btnSummaryDone) btnSummaryDone.onclick = () => { state.view = "deck"; render(); };
}

// ---------- klavye kısayolları ----------
// Yalnızca çalışma ekranında ve hiçbir pencere açık değilken çalışır.
document.addEventListener("keydown", (e) => {
  if (state.view !== "study" || modalOpen()) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA") return;

  const card = state.queue[state.qIndex];
  if (!card) return;

  if (state.studyMode === "flip") {
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      state.flipped = !state.flipped; render();
      return;
    }
    if (state.flipped && (e.key === "1" || e.key === "2" || e.key === "3")) {
      e.preventDefault();
      handleFlipAnswer(e.key === "1" ? "wrong" : e.key === "2" ? "know" : "master");
      return;
    }
  } else if (state.studyMode === "mc") {
    const n = Number(e.key);
    if (state.mcSelected === null && n >= 1 && n <= state.mcOptions.length) {
      e.preventDefault(); handleMcSelect(state.mcOptions[n - 1]); return;
    }
    if (state.mcSelected !== null && (e.key === " " || e.key === "Enter")) {
      e.preventDefault(); advanceQueue(); return;
    }
  }

  if (e.key === "ArrowLeft") { e.preventDefault(); goToPreviousCard(); }
  else if (e.key === "s" || e.key === "S") { e.preventDefault(); speak(state.flipped ? card.back : card.front); }
  else if (e.key === "z" || e.key === "Z") { e.preventDefault(); undoLastAction(); }
  else if (e.key === "Escape") { e.preventDefault(); commitSessionStats(); state.view = "deck"; render(); }
});

document.addEventListener("visibilitychange", () => { if (document.hidden) saveSessionSnapshot(); });
window.addEventListener("pagehide", saveSessionSnapshot);

render();
</script>
</body>
</html>
