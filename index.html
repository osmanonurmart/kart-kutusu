function bindEvents() {
  document.querySelectorAll("[data-select-user]").forEach((el) => {
    el.onclick = () => { state.currentUser = el.dataset.selectUser; saveCurrentUser(state.currentUser); render(); };
  });

  const btnNavStats = document.getElementById("btn-nav-stats");
  if (btnNavStats) btnNavStats.onclick = () => { state.view = "stats"; render(); };

  const btnNavBackup = document.getElementById("btn-nav-backup");
  if (btnNavBackup) btnNavBackup.onclick = () => {
    state.restorePreview = null; state.restoreError = null; state.restoreBusy = false;
    state.showBackup = true; render();
  };

  const btnNewDeck = document.getElementById("btn-new-deck");
  if (btnNewDeck) btnNewDeck.onclick = () => { state.showNewDeck = true; render(); };

  document.querySelectorAll("[data-open-deck]").forEach((el) => {
    el.onclick = () => { state.activeDeckId = el.dataset.openDeck; state.viewRetired = false; state.view = "deck"; render(); };
  });
  document.querySelectorAll("[data-open-retired]").forEach((el) => {
    el.onclick = () => { state.activeDeckId = el.dataset.openRetired; state.viewRetired = true; state.view = "deck"; render(); };
  });

  const btnBack = document.getElementById("btn-back-home");
  if (btnBack) btnBack.onclick = () => { state.viewRetired = false; state.view = "home"; render(); };
  const btnBackDeck = document.getElementById("btn-back-deck");
  if (btnBackDeck) btnBackDeck.onclick = () => { state.viewRetired = false; render(); };

  const btnDeleteDeck = document.getElementById("btn-delete-deck");
  if (btnDeleteDeck) btnDeleteDeck.onclick = () => {
    const deck = decks.find((d) => d.id === state.activeDeckId);
    if (deck) deleteDeck(deck.id, deck.name);
  };

  const btnStudy = document.getElementById("btn-study");
  if (btnStudy) btnStudy.onclick = () => startStudy();
  document.querySelectorAll("[data-set-together]").forEach((el) => {
    el.onclick = () => {
      state.together = el.dataset.setTogether === "1";
      localStorage.setItem("flashcard-together", state.together ? "1" : "0");
      render();
    };
  });
  document.querySelectorAll("[data-retire-deck]").forEach((el) => {
    el.onclick = (e) => { e.stopPropagation(); retireMastered(el.dataset.retireDeck); };
  });
  document.querySelectorAll("[data-unretire]").forEach((el) => {
    el.onclick = (e) => { e.stopPropagation(); unretireCard(el.dataset.unretire); };
  });
  document.querySelectorAll("[data-set-box]").forEach((el) => {
    el.onclick = (e) => { e.stopPropagation(); setBoxManually(el.dataset.setBox, Number(el.dataset.boxVal)); };
  });

  const btnAddCard = document.getElementById("btn-add-card");
  if (btnAddCard) btnAddCard.onclick = () => {
    state.editingCardId = null;
    state.formFront = ""; state.formBack = ""; state.formVisibility = lastVisibility;
    state.formImage = null; state.formImageError = null; state.formImageBusy = false;
    state.focusFrontOnOpen = true;
    state.showCardForm = true; render();
  };
  // ---- kart arama ----
  const inputCardSearch = document.getElementById("input-card-search");
  if (inputCardSearch) {
    inputCardSearch.oninput = () => { state.deckSearch = inputCardSearch.value; applyCardSearch(); };
    inputCardSearch.onsearch = () => { state.deckSearch = inputCardSearch.value; applyCardSearch(); };
  }

  // ---- kart görseli ----
  const inputCardImage = document.getElementById("input-card-image");
  const btnPickImage = document.getElementById("btn-pick-image");
  if (btnPickImage && inputCardImage) btnPickImage.onclick = () => inputCardImage.click();
  if (inputCardImage) inputCardImage.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    state.formImageBusy = true; state.formImageError = null; render();
    try {
      state.formImage = await resizeImageFile(file);
    } catch (err) {
      state.formImageError = err.message;
    }
    state.formImageBusy = false; render();
  };
  const btnRemoveImage = document.getElementById("btn-remove-image");
  if (btnRemoveImage) btnRemoveImage.onclick = () => { state.formImage = null; state.formImageError = null; render(); };

  // ---- sesli okuma ----
  document.querySelectorAll("[data-speak]").forEach((el) => {
    el.onclick = (e) => { e.stopPropagation(); speak(el.dataset.speak); };
  });

  const btnOpenImport = document.getElementById("btn-open-import");
  if (btnOpenImport) btnOpenImport.onclick = () => { state.importText = ""; state.showImport = true; render(); };
  const btnOpenExport = document.getElementById("btn-open-export");
  if (btnOpenExport) btnOpenExport.onclick = () => { state.showExport = true; render(); };

  document.querySelectorAll("[data-edit-card]").forEach((el) => {
    el.onclick = () => {
      const c = cards.find((x) => x.id === el.dataset.editCard);
      if (!c) return;
      state.editingCardId = c.id;
      state.formFront = c.front; state.formBack = c.back;
      state.formVisibility = c.visibility || "both";
      state.formImage = c.image || null; state.formImageError = null; state.formImageBusy = false;
      state.focusFrontOnOpen = false;
      state.showCardForm = true; render();
    };
  });
  document.querySelectorAll("[data-delete-card]").forEach((el) => {
    el.onclick = () => {
      const c = cards.find((x) => x.id === el.dataset.deleteCard);
      if (!c) return;
      // Kart ve ona bağlı tüm ilerleme kalıcı olarak silinir — önce sor.
      if (!confirm(`"${c.front}" kartını silmek istiyor musun?\n\nBu kartın ilerlemesi de silinecek ve geri alınamaz.`)) return;
      deleteCard(c.id);
    };
  });

  const overlayNewDeck = document.getElementById("overlay-new-deck");
  if (overlayNewDeck) overlayNewDeck.onclick = (e) => { if (e.target === overlayNewDeck) { state.showNewDeck = false; render(); } };
  const closeNewDeck = document.getElementById("close-new-deck");
  if (closeNewDeck) closeNewDeck.onclick = () => { state.showNewDeck = false; render(); };
  const inputDeckName = document.getElementById("input-deck-name");
  if (inputDeckName) {
    inputDeckName.focus(); inputDeckName.selectionStart = inputDeckName.value.length;
    inputDeckName.oninput = (e) => { state.newDeckName = e.target.value; };
    inputDeckName.onkeydown = (e) => { if (e.key === "Enter") createDeck(); };
  }
  const btnCreateDeck = document.getElementById("btn-create-deck");
  if (btnCreateDeck) btnCreateDeck.onclick = createDeck;

  const overlayCardForm = document.getElementById("overlay-card-form");
  if (overlayCardForm) overlayCardForm.onclick = (e) => { if (e.target === overlayCardForm) { state.showCardForm = false; render(); } };
  const closeCardForm = document.getElementById("close-card-form");
  if (closeCardForm) closeCardForm.onclick = () => { state.showCardForm = false; render(); };

  document.querySelectorAll("[data-set-vis]").forEach((el) => { el.onclick = () => { state.formVisibility = el.dataset.setVis; saveLastVisibility(state.formVisibility); render(); }; });

  function autoGrow(el) { el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 260) + "px"; }

  document.querySelectorAll(".list-editor").forEach((el) => { el.onkeydown = (e) => handleListEnter(el, e); });
  document.querySelectorAll("[data-rt]").forEach((btn) => {
    btn.onclick = () => {
      const el = document.getElementById(btn.dataset.rtTarget);
      if (el) { toggleListOnSelection(el, btn.dataset.rt); autoGrow(el); }
    };
  });

  const inputFront = document.getElementById("input-front");
  if (inputFront) {
    autoGrow(inputFront);
    inputFront.oninput = (e) => { state.formFront = e.target.value; autoGrow(inputFront); };
    if (state.focusFrontOnOpen) { inputFront.focus(); state.focusFrontOnOpen = false; }
  }
  const inputBack = document.getElementById("input-back");
  if (inputBack) {
    autoGrow(inputBack);
    inputBack.oninput = (e) => { state.formBack = e.target.value; autoGrow(inputBack); };
  }

  const btnSaveCard = document.getElementById("btn-save-card");
  if (btnSaveCard) btnSaveCard.onclick = saveCardForm;

  const overlayImport = document.getElementById("overlay-import");
  if (overlayImport) overlayImport.onclick = (e) => { if (e.target === overlayImport) { state.showImport = false; render(); } };
  const closeImport = document.getElementById("close-import");
  if (closeImport) closeImport.onclick = () => { state.showImport = false; render(); };
  const inputImport = document.getElementById("input-import");
  if (inputImport) { inputImport.focus(); inputImport.oninput = (e) => { state.importText = e.target.value; render(); }; }
  const btnRunImport = document.getElementById("btn-run-import");
  if (btnRunImport) btnRunImport.onclick = runImport;

  const overlayExport = document.getElementById("overlay-export");
  if (overlayExport) overlayExport.onclick = (e) => { if (e.target === overlayExport) { state.showExport = false; render(); } };
  const closeExport = document.getElementById("close-export");
  if (closeExport) closeExport.onclick = () => { state.showExport = false; render(); };
  const btnCopyExport = document.getElementById("btn-copy-export");
  if (btnCopyExport) btnCopyExport.onclick = async () => {
    const ta = document.getElementById("export-text");
    try {
      await navigator.clipboard.writeText(ta.value);
      const prev = btnCopyExport.textContent;
      btnCopyExport.textContent = "✓ Kopyalandı";
      setTimeout(() => { btnCopyExport.textContent = prev; }, 1500);
    } catch (err) {
      ta.select();
      document.execCommand("copy");
    }
  };

  // ---- yedek modalı ----
  const closeBackupModal = () => {
    if (state.restoreBusy) return;   // geri yükleme sürerken kapatma
    state.showBackup = false; state.restorePreview = null; state.restoreError = null; render();
  };
  const overlayBackup = document.getElementById("overlay-backup");
  if (overlayBackup) overlayBackup.onclick = (e) => { if (e.target === overlayBackup) closeBackupModal(); };
  const closeBackup = document.getElementById("close-backup");
  if (closeBackup) closeBackup.onclick = closeBackupModal;

  const btnDownloadBackup = document.getElementById("btn-download-backup");
  if (btnDownloadBackup) btnDownloadBackup.onclick = () => {
    downloadBackup();
    btnDownloadBackup.textContent = "✓ İndirildi";
    setTimeout(() => { const b = document.getElementById("btn-download-backup"); if (b) b.textContent = "⇩ Yedek dosyasını indir"; }, 1800);
  };

  const inputBackupFile = document.getElementById("input-backup-file");
  const btnPickBackup = document.getElementById("btn-pick-backup");
  if (btnPickBackup && inputBackupFile) btnPickBackup.onclick = () => inputBackupFile.click();
  if (inputBackupFile) inputBackupFile.onchange = (e) => handleBackupFile(e.target.files[0]);

  const btnRunRestore = document.getElementById("btn-run-restore");
  if (btnRunRestore) btnRunRestore.onclick = runRestore;


  const btnExitStudy = document.getElementById("btn-exit-study");
  if (btnExitStudy) btnExitStudy.onclick = finishSession;
  const btnDeleteStudyCard = document.getElementById("btn-delete-study-card");
  if (btnDeleteStudyCard) btnDeleteStudyCard.onclick = deleteStudyCard;
  const btnEditStudyCard = document.getElementById("btn-edit-study-card");
  if (btnEditStudyCard) btnEditStudyCard.onclick = () => {
    const c = state.queue[state.qIndex];
    if (!c) return;
    state.editingCardId = c.id;
    state.formFront = c.front; state.formBack = c.back;
    state.formVisibility = c.visibility || "both";
    state.formImage = c.image || null; state.formImageError = null; state.formImageBusy = false;
    state.focusFrontOnOpen = false;
    state.showCardForm = true; render();
  };
  const flipCard = document.getElementById("flip-card");
  if (flipCard) flipCard.onclick = () => { state.flipped = !state.flipped; render(); };
  document.querySelectorAll("[data-answer]").forEach((el) => {
    el.onclick = () => handleAnswer(el.dataset.answer);
  });
  const btnPrevCard = document.getElementById("btn-prev-card");
  if (btnPrevCard) btnPrevCard.onclick = goToPreviousCard;
  const btnUndo = document.getElementById("btn-undo");
  if (btnUndo) btnUndo.onclick = undoLastAction;

  const btnSummaryDone = document.getElementById("btn-summary-done");
  if (btnSummaryDone) btnSummaryDone.onclick = () => { state.view = "deck"; render(); };
}

// ---------- klavye kısayolları ----------
// Yalnızca çalışma ekranında ve hiçbir pencere açık değilken çalışır.
document.addEventListener("keydown", (e) => {
  if (state.view !== "study" || modalOpen()) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA") return;

  const card = state.queue[state.qIndex];
  if (!card) return;

  if (e.key === " " || e.key === "Enter") {
    e.preventDefault();
    state.flipped = !state.flipped; render();
    return;
  }
  // Kısayolların sırası ekrandaki düğmelerle aynı.
  if (state.flipped) {
    const codes = togetherMode(card) ? { "1": "10", "2": "01", "3": "11", "4": "00" } : { "1": "solo0", "2": "solo1" };
    if (codes[e.key]) { e.preventDefault(); handleAnswer(codes[e.key]); return; }
  }

  if (e.key === "ArrowLeft") { e.preventDefault(); goToPreviousCard(); }
  else if (e.key === "s" || e.key === "S") { e.preventDefault(); speak(state.flipped ? card.back : card.front); }
  else if (e.key === "z" || e.key === "Z") { e.preventDefault(); undoLastAction(); }
  else if (e.key === "Escape") { e.preventDefault(); finishSession(); }
});



// Sekme arkaya alınır veya kapatılırsa biriken günlük sayaçlar kaybolmasın.
document.addEventListener("visibilitychange", () => { if (document.hidden) commitSessionStats(); });
window.addEventListener("pagehide", () => { commitSessionStats(); });

render();
</script>
</body>
</html>
