<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Kart Kutusu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    --bg: #12232A;
    --panel: #17313A;
    --panel2: #1D3D47;
    --card: #F0F6F4;
    --ink: #12232A;
    --text: #E9F3F0;
    --muted: rgba(233,243,240,0.62);
    --coral: #FF7A59;
    --gold: #F2C14E;
    --success: #45B08C;
    --danger: #E1574F;
    --border: rgba(233,243,240,0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); font-family:'Inter',system-ui,sans-serif; color:var(--text); -webkit-tap-highlight-color:transparent; }
  #app { max-width:480px; margin:0 auto; padding:20px 16px 60px; min-height:100vh; }
  h1,h2,h3 { font-family:'Fraunces',Georgia,serif; margin:0; }
  .mono { font-family:'IBM Plex Mono',ui-monospace,monospace; }
  .muted { color:var(--muted); }
  button { font-family:inherit; border:none; cursor:pointer; }
  input, textarea { font-family:inherit; }
  .btn { border-radius:12px; padding:13px; font-weight:600; font-size:14px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-primary { background:var(--coral); color:#1A0F0A; }
  .btn-gold { background:var(--gold); color:#1A0F0A; }
  .btn-outline { background:transparent; color:var(--text); border:1.5px dashed var(--border); }
  .btn-ghost { background:var(--panel); color:var(--text); border:1px solid var(--border); }
  .btn:disabled { opacity:0.4; cursor:default; }
  .row { display:flex; align-items:center; justify-content:space-between; }
  .top-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .user-switch { display:flex; gap:6px; margin-bottom:14px; }
  .user-pill { flex:1; text-align:center; padding:9px 6px; border-radius:12px; background:var(--panel); border:1.5px solid var(--border); color:var(--muted); font-weight:600; font-size:13px; }
  .user-pill.active { background:rgba(242,193,78,0.14); border-color:var(--gold); color:var(--gold); }
  .nav-row { display:flex; gap:8px; margin-bottom:18px; }
  .nav-btn { flex:1; padding:9px; border-radius:10px; background:var(--panel); border:1px solid var(--border); color:var(--text); font-size:13px; font-weight:600; }
  .streak-pill { display:flex; align-items:center; gap:5px; background:var(--panel); border:1px solid var(--border); border-radius:999px; padding:6px 12px; font-size:14px; font-weight:600; color:var(--gold); }
  .deck-card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; cursor:pointer; }
  .deck-name { font-size:18px; font-weight:600; }
  .due-badge { font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; background:rgba(255,122,89,0.18); color:var(--coral); white-space:nowrap; }
  .progress-track { width:100%; height:6px; border-radius:6px; background:rgba(233,243,240,0.1); overflow:hidden; margin-top:8px; }
  .progress-fill { height:100%; background:var(--success); }
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stage-header { display:flex; align-items:center; gap:8px; margin:20px 0 8px; font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
  .stage-header .count { font-family:'IBM Plex Mono',monospace; }
  .card-row { display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .thumb { width:38px; height:38px; border-radius:6px; object-fit:cover; flex-shrink:0; background:var(--panel2); }
  .card-row .front { font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card-row .back { font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vis-tag { font-size:10px; padding:2px 6px; border-radius:999px; background:var(--panel2); color:var(--muted); flex-shrink:0; }
  .box-dots { display:flex; align-items:center; gap:4px; flex-shrink:0; }
  .box-label { font-size:11px; font-weight:700; color:var(--muted); margin-right:2px; }
  .box-dot { width:11px; height:11px; border-radius:50%; background:rgba(233,243,240,0.15); cursor:pointer; }
  .box-dot.on1 { background:#E1574F; }
  .box-dot.on2 { background:#FF7A59; }
  .box-dot.on3 { background:#F2C14E; }
  .box-dot.on4 { background:#9FCB88; }
  .box-dot.on5 { background:#45B08C; }
  .icon-btn { background:none; padding:4px; color:var(--muted); flex-shrink:0; }
  .icon-btn.danger { color:var(--danger); }
  .back-link { display:flex; align-items:center; gap:4px; font-size:14px; color:var(--muted); background:none; margin-bottom:16px; padding:0; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:flex-end; justify-content:center; z-index:50; padding:0 16px 16px; }
  .modal { width:100%; max-width:480px; background:var(--panel2); border:1px solid var(--border); border-radius:18px; max-height:85vh; display:flex; flex-direction:column; overflow:hidden; }
  .modal-body { padding:20px; overflow-y:auto; flex:1; min-height:0; }
  .modal-footer { padding:12px 20px 18px; border-top:1px solid var(--border); flex-shrink:0; }
  .modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .field-label { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:5px; margin-bottom:6px; }
  textarea, .text-input { width:100%; border-radius:10px; padding:10px 12px; background:var(--panel); color:var(--text); border:1px solid var(--border); outline:none; resize:none; margin-bottom:14px; font-size:14px; }
  .img-picker { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .img-preview { width:56px; height:56px; border-radius:8px; object-fit:cover; background:var(--panel); flex-shrink:0; }
  .img-pick-btn { font-size:12px; padding:8px 12px; border-radius:8px; background:var(--panel); color:var(--text); border:1px solid var(--border); }
  .img-remove-btn { font-size:12px; color:var(--danger); background:none; }
  .visibility-toggle { display:flex; gap:8px; margin-bottom:16px; }
  .vis-pill { flex:1; text-align:center; padding:9px 6px; border-radius:10px; background:var(--panel); border:1.5px solid var(--border); color:var(--muted); font-size:12.5px; font-weight:600; }
  .vis-pill.active { background:rgba(255,122,89,0.15); border-color:var(--coral); color:var(--coral); }
  .perspective { perspective:1500px; height:300px; margin-bottom:20px; }
  .flip-inner { position:relative; width:100%; height:100%; cursor:pointer; transition:transform .6s cubic-bezier(.65,0,.35,1); transform-style:preserve-3d; }
  .flip-inner:active { transition-duration:.15s; }
  .flip-inner.flipped { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; border-radius:20px; background:var(--card); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; backface-visibility:hidden; box-shadow:0 14px 34px rgba(0,0,0,0.38), 0 2px 8px rgba(0,0,0,0.22); transition:box-shadow .6s ease; }
  .face.back { transform:rotateY(180deg); }
  .face-label { position:absolute; top:16px; left:20px; font-size:10px; letter-spacing:2px; color:var(--muted); }
  .face img { width:90px; height:90px; border-radius:10px; object-fit:cover; margin-bottom:14px; }
  .face-text { font-family:'Fraunces',Georgia,serif; font-size:21px; font-weight:600; color:var(--ink); padding:0 8px; }
  .answer-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:10px; }
  .answer-btn { border-radius:14px; padding:15px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px; }
  .master-btn { width:100%; border-radius:12px; padding:11px; font-weight:600; font-size:13px; background:rgba(242,193,78,0.14); color:var(--gold); border:1.5px solid var(--gold); margin-bottom:10px; }
  .nav-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .nav-actions .btn-secondary { border-radius:12px; padding:11px; font-weight:600; font-size:13px; background:var(--panel); color:var(--text); border:1px solid var(--border); }
  .nav-actions .btn-secondary:disabled { opacity:0.35; }
  @keyframes cardEnter { from { opacity:0; transform:translateY(10px) scale(0.97); } to { opacity:1; transform:translateY(0) scale(1); } }
  .perspective, .mc-question { animation:cardEnter .38s cubic-bezier(.2,.8,.3,1); }
  .hint { text-align:center; font-size:12px; color:var(--muted); }
  .mc-question { background:var(--card); border-radius:18px; padding:24px; margin-bottom:18px; display:flex; flex-direction:column; align-items:center; text-align:center; min-height:150px; justify-content:center; }
  .mc-question img { width:76px; height:76px; border-radius:10px; object-fit:cover; margin-bottom:12px; }
  .mc-question p { font-family:'Fraunces',Georgia,serif; font-size:18px; font-weight:600; color:var(--ink); }
  .mc-option { width:100%; text-align:left; border-radius:12px; padding:13px 16px; font-size:14px; font-weight:500; margin-bottom:9px; background:var(--panel); border:1.5px solid var(--border); color:var(--text); }
  .progress-bar-outer { width:100%; height:4px; border-radius:4px; background:rgba(233,243,240,0.1); overflow:hidden; margin-bottom:20px; }
  .progress-bar-inner { height:100%; background:var(--coral); }
  .undo-btn { font-size:12px; color:var(--muted); background:none; text-decoration:underline; display:block; margin:0 auto 16px; }
  .summary-icon { width:80px; height:80px; border-radius:50%; margin:0 auto 18px; background:rgba(242,193,78,0.15); display:flex; align-items:center; justify-content:center; font-size:34px; }
  .stat-box { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px; text-align:center; }
  .stat-num { font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:700; }
  .empty-state { text-align:center; padding:40px 0; color:var(--muted); font-size:14px; }
  .setup-box { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:20px; margin-top:40px; line-height:1.6; font-size:14px; }
  .setup-box code { background:var(--panel2); padding:2px 6px; border-radius:4px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; }
  .setup-box ol { padding-left:20px; }
  .loading-screen { display:flex; align-items:center; justify-content:center; min-height:80vh; color:var(--muted); font-size:14px; }
  .user-stat-card { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:14px; }
  .user-stat-head { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .avatar { width:38px; height:38px; border-radius:50%; background:var(--panel2); display:flex; align-items:center; justify-content:center; font-weight:700; font-family:'Fraunces',Georgia,serif; color:var(--gold); flex-shrink:0; }
  .level-badge { font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; background:rgba(69,176,140,0.15); color:var(--success); margin-left:auto; }
  .stat-mini-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .stat-mini { background:var(--panel2); border-radius:10px; padding:10px; text-align:center; }
  .stat-mini .n { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:17px; }
  .stat-mini .l { font-size:10px; color:var(--muted); margin-top:2px; }
  .import-count { font-size:12px; color:var(--muted); margin:-8px 0 14px; }
  .curve-box { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px 12px 12px; margin-bottom:16px; }
  .curve-title { font-size:12px; color:var(--muted); font-weight:600; margin-bottom:12px; }
  .curve-row { display:flex; align-items:flex-end; gap:8px; height:64px; }
  .curve-col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .curve-count { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text); margin-bottom:4px; }
  .curve-bar { width:100%; border-radius:5px 5px 2px 2px; min-height:4px; }
  .curve-labels { display:flex; gap:8px; margin-top:8px; }
  .curve-label { flex:1; text-align:center; font-size:9.5px; color:var(--muted); }
  .deck-title-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
</style>
</head>
<body>
<div id="app"><div class="loading-screen">Yükleniyor…</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, setDoc, getDoc,
  onSnapshot, writeBatch,
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

// =========================================================================
// AYARLAR — kullanıcı isimlerini burada değiştirebilirsin.
// =========================================================================
const USERS = ["Onur", "Fatma"];

// Firebase config — Firebase konsolundan aldığın config'i buraya yapıştır.
const firebaseConfig = {
  apiKey: "AIzaSyBF8Kp6YYL5IsT2qvmeSlp58tiP-e03Big",
  authDomain: "flashcard-69447.firebaseapp.com",
  projectId: "flashcard-69447",
  storageBucket: "flashcard-69447.firebasestorage.app",
  messagingSenderId: "527560231736",
  appId: "1:527560231736:web:1fd93201d772c734eacfcd",
};

const NOT_CONFIGURED = firebaseConfig.apiKey.startsWith("BURAYA");
const appEl = document.getElementById("app");

if (NOT_CONFIGURED) {
  appEl.innerHTML = `
    <div class="setup-box">
      <h2 style="margin-bottom:10px;">Firebase henüz bağlanmadı</h2>
      <p class="muted">Uygulamanın çalışması için önce ücretsiz bir Firebase projesi kurup buraya bağlaman gerekiyor.</p>
      <ol>
        <li><a href="https://console.firebase.google.com" target="_blank" style="color:var(--coral)">console.firebase.google.com</a>'da yeni proje oluştur</li>
        <li>Sol menüden <b>Build → Firestore Database</b> aç, "test mode" ile başlat</li>
        <li>Proje ayarları (⚙️) → <b>SDK setup and configuration</b>'dan config kodunu kopyala</li>
        <li>Bu dosyada <code>firebaseConfig</code> nesnesindeki <code>BURAYA_...</code> alanlarını kendi değerlerinle değiştir</li>
        <li>Dosyayı kaydedip yeniden aç</li>
      </ol>
    </div>`;
  throw new Error("Firebase config not set");
}

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const decksCol = collection(db, "decks");
const cardsCol = collection(db, "cards");
const progressCol = collection(db, "progress");
const statsCol = collection(db, "stats");

// ---------- constants ----------
const BOX_INTERVAL_DAYS = [0, 0, 1, 3, 7, 14];
const MAX_BOX = 5;
const MASTER_INTERVAL_DAYS = 30;

// ---------- helpers ----------
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
function daysAgoStr(n) { const d = new Date(); d.setDate(d.getDate() - n); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
function esc(s) { return (s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function progressKey(user, cardId) { return `${user}__${cardId}`; }
function isDueProgress(p) { if (!p || !p.nextReview) return true; return new Date(p.nextReview).getTime() <= Date.now(); }

function loadCurrentUser() {
  const saved = localStorage.getItem("flashcard-user");
  return USERS.includes(saved) ? saved : USERS[0];
}
function saveCurrentUser(u) { localStorage.setItem("flashcard-user", u); }

let lastVisibility = localStorage.getItem("flashcard-last-visibility") || "both";
function saveLastVisibility(v) { lastVisibility = v; localStorage.setItem("flashcard-last-visibility", v); }

// ---------- state ----------
let decks = [];
let cards = [];
let progressList = [];
let statsList = [];

const state = {
  view: "home", // home | deck | study | summary | stats
  currentUser: loadCurrentUser(),
  activeDeckId: null,
  showNewDeck: false,
  newDeckName: "",
  showCardForm: false,
  showImport: false,
  showExport: false,
  importText: "",
  editingCardId: null,
  formFront: "",
  formBack: "",
  formVisibility: "both", // 'both' | user name
  focusFrontOnOpen: false,
  studyMode: "flip",
  studyOrder: localStorage.getItem("flashcard-study-order") || "shuffled", // 'shuffled' | 'sequential'
  queue: [],
  qIndex: 0,
  flipped: false,
  mcOptions: [],
  mcSelected: null,
  sessionCorrect: 0,
  sessionWrong: 0,
  lastAction: null, // for undo
};

function modalOpen() { return state.showNewDeck || state.showCardForm || state.showImport || state.showExport; }
let pendingRender = false;
function maybeRender() { if (modalOpen()) pendingRender = true; else render(); }

// ---------- image resize ----------
// ---------- progress / stats helpers ----------
function getProgress(cardId, user) {
  return progressList.find((p) => p.cardId === cardId && p.user === user) || { box: 1, nextReview: null, correctCount: 0, wrongCount: 0 };
}
function getStats(user) {
  return statsList.find((s) => s.id === user) || { streak: 0, lastStudyDate: null, totalReviewed: 0 };
}
function visibleCards(deckId, user) {
  return cards.filter((c) => c.deckId === deckId && (c.visibility === "both" || c.visibility === user));
}
function masteredCountFor(user) {
  return progressList.filter((p) => p.user === user && p.box >= MAX_BOX).length;
}
function levelFor(masteredCount) {
  if (masteredCount < 15) return "Başlangıç";
  if (masteredCount < 60) return "Orta seviye";
  if (masteredCount < 150) return "İleri seviye";
  return "Usta";
}

const STAGE_DEFS = [
  { box: 1, label: "Yeni", color: "#E1574F" },
  { box: 2, label: "Zayıf", color: "#FF7A59" },
  { box: 3, label: "Orta", color: "#F2C14E" },
  { box: 4, label: "İyi", color: "#9FCB88" },
  { box: 5, label: "Ustalaştı", color: "#45B08C" },
];
function renderLearningCurve(cardList, user, title) {
  const counts = STAGE_DEFS.map((s) => cardList.filter((c) => getProgress(c.id, user).box === s.box).length);
  const max = Math.max(1, ...counts);
  return `
    <div class="curve-box">
      <div class="curve-title">${esc(title || "Öğrenme eğrisi")}</div>
      <div class="curve-row">
        ${STAGE_DEFS.map((s, i) => `
          <div class="curve-col">
            <div class="curve-count">${counts[i]}</div>
            <div class="curve-bar" style="height:${Math.max(6, Math.round((counts[i] / max) * 100))}%;background:${s.color};"></div>
          </div>`).join("")}
      </div>
      <div class="curve-labels">${STAGE_DEFS.map((s) => `<div class="curve-label" style="color:${s.color};">${esc(s.label)}</div>`).join("")}</div>
    </div>`;
}

// ---------- firestore CRUD ----------
async function createDeck() {
  if (!state.newDeckName.trim()) return;
  await addDoc(decksCol, { name: state.newDeckName.trim(), createdAt: Date.now() });
  state.newDeckName = ""; state.showNewDeck = false;
  pendingRender = false; render();
}

async function deleteDeck(deckId, deckName) {
  if (!confirm(`"${deckName}" destesini silmek istiyor musun? İçindeki tüm kartlar da silinecek.`)) return;
  const batch = writeBatch(db);
  batch.delete(doc(db, "decks", deckId));
  const deckCardIds = cards.filter((c) => c.deckId === deckId).map((c) => c.id);
  deckCardIds.forEach((id) => batch.delete(doc(db, "cards", id)));
  progressList.filter((p) => deckCardIds.includes(p.cardId)).forEach((p) => batch.delete(doc(db, "progress", p.id)));
  await batch.commit();
  if (state.activeDeckId === deckId) { state.view = "home"; state.activeDeckId = null; }
  render();
}

async function saveCardForm() {
  if (!state.formFront.trim() || !state.formBack.trim()) return;
  const payload = {
    deckId: state.activeDeckId,
    front: state.formFront.trim(),
    back: state.formBack.trim(),
    visibility: state.formVisibility,
  };
  const btn = document.getElementById("btn-save-card");
  if (btn) { btn.disabled = true; btn.textContent = "Kaydediliyor…"; }
  try {
    if (state.editingCardId) {
      await updateDoc(doc(db, "cards", state.editingCardId), payload);
      // eğer bu kart çalışma oturumundaki kuyrukta duruyorsa, orada da güncelle
      const qc = state.queue.find((c) => c.id === state.editingCardId);
      if (qc) Object.assign(qc, payload);
    } else {
      await addDoc(cardsCol, { ...payload, createdBy: state.currentUser, createdAt: Date.now() });
    }
    state.showCardForm = false; pendingRender = false; render();
  } catch (err) {
    console.error(err);
    alert("Kart kaydedilemedi: " + err.message + "\n\nİnternet bağlantını kontrol et ve tekrar dene.");
    if (btn) { btn.disabled = false; btn.textContent = "Kaydet"; }
  }
}

async function setBoxManually(cardId, box) {
  const user = state.currentUser;
  const key = progressKey(user, cardId);
  const existingDoc = progressList.find((p) => p.id === key);
  const cur = existingDoc || { correctCount: 0, wrongCount: 0 };
  const days = BOX_INTERVAL_DAYS[box] ?? 0;
  const d = new Date(); d.setDate(d.getDate() + days);
  const nextReview = days === 0 ? new Date().toISOString() : d.toISOString();
  const card = cards.find((c) => c.id === cardId);
  await setDoc(doc(db, "progress", key), {
    box, nextReview,
    correctCount: cur.correctCount || 0, wrongCount: cur.wrongCount || 0,
    user, cardId, deckId: card ? card.deckId : state.activeDeckId, updatedAt: Date.now(),
  }, { merge: false });
}

async function deleteCard(cardId) {
  await deleteDoc(doc(db, "cards", cardId));
  const relatedProgress = progressList.filter((p) => p.cardId === cardId);
  if (relatedProgress.length) {
    const batch = writeBatch(db);
    relatedProgress.forEach((p) => batch.delete(doc(db, "progress", p.id)));
    await batch.commit();
  }
}

// ---------- import ----------
function parseImportText(text) {
  const lines = text.split("\n");
  const pairs = [];
  for (const raw of lines) {
    const line = raw.replace(/\r$/, "");
    if (!line.trim()) continue;
    let front, back;
    if (line.includes("\t")) {
      const parts = line.split("\t");
      front = parts[0]; back = parts.slice(1).join(" ");
    } else if (line.includes(" - ")) {
      const idx = line.indexOf(" - ");
      front = line.slice(0, idx); back = line.slice(idx + 3);
    } else if (line.includes("-")) {
      const idx = line.indexOf("-");
      front = line.slice(0, idx); back = line.slice(idx + 1);
    } else continue;
    front = front.trim(); back = back.trim();
    if (front && back) pairs.push({ front, back });
  }
  return pairs;
}
async function runImport() {
  const pairs = parseImportText(state.importText);
  if (pairs.length === 0) return;
  const chunks = [];
  for (let i = 0; i < pairs.length; i += 400) chunks.push(pairs.slice(i, i + 400));
  for (const chunk of chunks) {
    const batch = writeBatch(db);
    chunk.forEach((pair) => {
      const ref = doc(cardsCol);
      batch.set(ref, {
        deckId: state.activeDeckId, front: pair.front, back: pair.back,
        visibility: "both",
        createdBy: state.currentUser, createdAt: Date.now(),
      });
    });
    await batch.commit();
  }
  state.showImport = false; state.importText = "";
  pendingRender = false; render();
  alert(`${pairs.length} kart eklendi.`);
}

// ---------- study session ----------
function buildMcOptions(card) {
  if (!card) return [];
  const pool = visibleCards(card.deckId, state.currentUser);
  const others = pool.filter((c) => c.id !== card.id && c.back.trim() !== card.back.trim());
  const shuffled = [...others].sort(() => Math.random() - 0.5).slice(0, 3);
  return [...shuffled.map((c) => c.back), card.back].sort(() => Math.random() - 0.5);
}
function deckSupportsMc(deckId, user) {
  const dc = visibleCards(deckId, user);
  const distinctBacks = new Set(dc.map((c) => c.back.trim()));
  return dc.length >= 2 && distinctBacks.size >= 2;
}
function startStudy(mode, all) {
  const pool = visibleCards(state.activeDeckId, state.currentUser);
  let due = all ? pool : pool.filter((c) => isDueProgress(getProgress(c.id, state.currentUser)));
  if (due.length === 0) due = pool;
  if (due.length === 0) return;
  state.queue = state.studyOrder === "sequential" ? [...due] : [...due].sort(() => Math.random() - 0.5);
  state.qIndex = 0; state.flipped = false;
  state.sessionCorrect = 0; state.sessionWrong = 0;
  state.studyMode = mode; state.mcSelected = null; state.lastAction = null;
  if (mode === "mc") state.mcOptions = buildMcOptions(state.queue[0]);
  state.view = "study"; render();
}
function advanceQueue() {
  const next = state.qIndex + 1;
  if (next >= state.queue.length) { finishSession(); return; }
  state.qIndex = next; state.flipped = false; state.mcSelected = null;
  if (state.studyMode === "mc") state.mcOptions = buildMcOptions(state.queue[next]);
  render();
}
async function finishSession() {
  const s = getStats(state.currentUser);
  const today = todayStr();
  const updated = { ...s };
  if (updated.lastStudyDate !== today) {
    updated.streak = updated.lastStudyDate === daysAgoStr(1) ? (updated.streak || 0) + 1 : 1;
    updated.lastStudyDate = today;
  }
  updated.totalReviewed = (updated.totalReviewed || 0) + state.queue.length;
  await setDoc(doc(db, "stats", state.currentUser), updated, { merge: true });
  state.view = "summary"; render();
}

// action: 'wrong' | 'know' | 'master'
async function applyReview(card, action) {
  const user = state.currentUser;
  const key = progressKey(user, card.id);
  const existingDoc = progressList.find((p) => p.id === key);
  const prev = existingDoc ? { ...existingDoc } : null;
  const cur = prev || { box: 1, nextReview: null, correctCount: 0, wrongCount: 0 };

  let box = cur.box, nextReview, correctDelta = 0, wrongDelta = 0;
  if (action === "wrong") {
    box = cur.box; // aynı aşamada kalır, düşmez
    nextReview = new Date().toISOString();
    wrongDelta = 1;
  } else if (action === "know") {
    box = Math.min(MAX_BOX, cur.box + 1);
    const days = BOX_INTERVAL_DAYS[box] ?? 0;
    const d = new Date(); d.setDate(d.getDate() + days);
    nextReview = days === 0 ? new Date().toISOString() : d.toISOString();
    correctDelta = 1;
  } else if (action === "master") {
    box = MAX_BOX;
    const d = new Date(); d.setDate(d.getDate() + MASTER_INTERVAL_DAYS);
    nextReview = d.toISOString();
    correctDelta = 1;
  }
  const next = { box, nextReview, correctCount: (cur.correctCount || 0) + correctDelta, wrongCount: (cur.wrongCount || 0) + wrongDelta, user, cardId: card.id, deckId: card.deckId, updatedAt: Date.now() };

  state.lastAction = { key, prevExisted: !!existingDoc, prevData: prev, queueIndex: state.qIndex, correctDelta, wrongDelta };
  await setDoc(doc(db, "progress", key), next, { merge: false });
  if (action === "wrong") state.sessionWrong++; else state.sessionCorrect++;
}

async function undoLastAction() {
  const a = state.lastAction;
  if (!a) return;
  if (a.prevExisted) await setDoc(doc(db, "progress", a.key), a.prevData, { merge: false });
  else await deleteDoc(doc(db, "progress", a.key));
  state.qIndex = a.queueIndex;
  state.sessionCorrect -= a.correctDelta;
  state.sessionWrong -= a.wrongDelta;
  state.flipped = false; state.mcSelected = null;
  if (state.studyMode === "mc") state.mcOptions = buildMcOptions(state.queue[state.qIndex]);
  state.lastAction = null;
  render();
}

function handleFlipAnswer(action) {
  const card = state.queue[state.qIndex];
  applyReview(card, action).then(() => advanceQueue());
}
function goToPreviousCard() {
  if (state.qIndex === 0) return;
  state.qIndex--;
  state.flipped = false; state.mcSelected = null;
  if (state.studyMode === "mc") state.mcOptions = buildMcOptions(state.queue[state.qIndex]);
  render();
}
function handleMcSelect(option) {
  if (state.mcSelected !== null) return;
  state.mcSelected = option;
  const card = state.queue[state.qIndex];
  const correct = option === card.back;
  applyReview(card, correct ? "know" : "wrong").then(() => render());
}

}

            Ya da Excel'de iki bitişik sütunu seçip kopyala, buraya yapıştır.
          </p>
          <textarea id="input-import" rows="8" placeholder="Elma - Apple&#10;Armut - Pear" style="margin-bottom:0;">${esc(state.importText)}</textarea>
          <p class="import-count">${pairs.length} kart bulunacak</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" id="btn-run-import" ${pairs.length === 0 ? "disabled" : ""}>İçe Aktar</button>
        </div>
      </div>
    </div>`;
}

function renderExportModal() {
  const deck = decks.find((d) => d.id === state.activeDeckId);
  const dc = deck ? visibleCards(deck.id, state.currentUser) : [];
  const text = dc.map((c) => `${c.front} - ${c.back}`).join("\n");
  return `
    <div class="modal-overlay" id="overlay-export">
      <div class="modal" id="modal-export">
        <div class="modal-body">
          <div class="modal-head"><h2 style="font-size:18px;">Dışa aktar</h2><button id="close-export" class="muted" style="background:none;">✕</button></div>
          <p class="muted" style="font-size:12.5px;margin-bottom:10px;line-height:1.5;">
            ${dc.length} kart, içe aktarma ile aynı formatta (<b>Ön - Arka</b>). Kopyala, istediğin yere yapıştır — başka bir deste veya arkadaşınla paylaşmak için de kullanabilirsin.
          </p>
          <textarea id="export-text" rows="10" readonly style="margin-bottom:0;">${esc(text)}</textarea>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" id="btn-copy-export" ${dc.length === 0 ? "disabled" : ""}>📋 Kopyala</button>
        </div>
      </div>
    </div>`;
}

// =========================================================================
// EVENTS
// =========================================================================
function bindEvents() {
  document.querySelectorAll("[data-select-user]").forEach((el) => {
    el.onclick = () => { state.currentUser = el.dataset.selectUser; saveCurrentUser(state.currentUser); render(); };
  });

  const btnNavStats = document.getElementById("btn-nav-stats");
  if (btnNavStats) btnNavStats.onclick = () => { state.view = "stats"; render(); };

  const btnNewDeck = document.getElementById("btn-new-deck");
  if (btnNewDeck) btnNewDeck.onclick = () => { state.showNewDeck = true; render(); };

  document.querySelectorAll("[data-open-deck]").forEach((el) => {
    el.onclick = () => { state.activeDeckId = el.dataset.openDeck; state.view = "deck"; render(); };
  });

  const btnBack = document.getElementById("btn-back-home");
  if (btnBack) btnBack.onclick = () => { state.view = "home"; render(); };

  const btnDeleteDeck = document.getElementById("btn-delete-deck");
  if (btnDeleteDeck) btnDeleteDeck.onclick = () => {
    const deck = decks.find((d) => d.id === state.activeDeckId);
    if (deck) deleteDeck(deck.id, deck.name);
  };

  const btnStudyFlip = document.getElementById("btn-study-flip");
  if (btnStudyFlip) btnStudyFlip.onclick = () => startStudy("flip", false);
  const btnStudyMc = document.getElementById("btn-study-mc");
  if (btnStudyMc) btnStudyMc.onclick = () => startStudy("mc", false);
  const btnStudyAll = document.getElementById("btn-study-all");
  if (btnStudyAll) btnStudyAll.onclick = () => startStudy("flip", true);
  document.querySelectorAll("[data-set-order]").forEach((el) => {
    el.onclick = () => { state.studyOrder = el.dataset.setOrder; localStorage.setItem("flashcard-study-order", state.studyOrder); render(); };
  });
  document.querySelectorAll("[data-set-box]").forEach((el) => {
    el.onclick = (e) => { e.stopPropagation(); setBoxManually(el.dataset.setBox, Number(el.dataset.boxVal)); };
  });

  const btnAddCard = document.getElementById("btn-add-card");
  if (btnAddCard) btnAddCard.onclick = () => {
    state.editingCardId = null;
    state.formFront = ""; state.formBack = ""; state.formVisibility = lastVisibility;
    state.focusFrontOnOpen = true;
    state.showCardForm = true; render();
  };
  const btnOpenImport = document.getElementById("btn-open-import");
  if (btnOpenImport) btnOpenImport.onclick = () => { state.importText = ""; state.showImport = true; render(); };
  const btnOpenExport = document.getElementById("btn-open-export");
  if (btnOpenExport) btnOpenExport.onclick = () => { state.showExport = true; render(); };

  document.querySelectorAll("[data-edit-card]").forEach((el) => {
    el.onclick = () => {
      const c = cards.find((x) => x.id === el.dataset.editCard);
      if (!c) return;
      state.editingCardId = c.id;
      state.formFront = c.front; state.formBack = c.back;
      state.formVisibility = c.visibility || "both";
      state.focusFrontOnOpen = false;
      state.showCardForm = true; render();
    };
  });
  document.querySelectorAll("[data-delete-card]").forEach((el) => { el.onclick = () => deleteCard(el.dataset.deleteCard); });

  const overlayNewDeck = document.getElementById("overlay-new-deck");
  if (overlayNewDeck) overlayNewDeck.onclick = (e) => { if (e.target === overlayNewDeck) { state.showNewDeck = false; render(); } };
  const closeNewDeck = document.getElementById("close-new-deck");
  if (closeNewDeck) closeNewDeck.onclick = () => { state.showNewDeck = false; render(); };
  const inputDeckName = document.getElementById("input-deck-name");
  if (inputDeckName) {
    inputDeckName.focus(); inputDeckName.selectionStart = inputDeckName.value.length;
    inputDeckName.oninput = (e) => { state.newDeckName = e.target.value; };
    inputDeckName.onkeydown = (e) => { if (e.key === "Enter") createDeck(); };
  }
  const btnCreateDeck = document.getElementById("btn-create-deck");
  if (btnCreateDeck) btnCreateDeck.onclick = createDeck;

  const overlayCardForm = document.getElementById("overlay-card-form");
  if (overlayCardForm) overlayCardForm.onclick = (e) => { if (e.target === overlayCardForm) { state.showCardForm = false; render(); } };
  const closeCardForm = document.getElementById("close-card-form");
  if (closeCardForm) closeCardForm.onclick = () => { state.showCardForm = false; render(); };

  document.querySelectorAll("[data-set-vis]").forEach((el) => { el.onclick = () => { state.formVisibility = el.dataset.setVis; saveLastVisibility(state.formVisibility); render(); }; });

  const inputFront = document.getElementById("input-front");
  if (inputFront) {
    inputFront.oninput = (e) => { state.formFront = e.target.value; };
    if (state.focusFrontOnOpen) { inputFront.focus(); state.focusFrontOnOpen = false; }
  }
  const inputBack = document.getElementById("input-back");
  if (inputBack) inputBack.oninput = (e) => { state.formBack = e.target.value; };

  const btnSaveCard = document.getElementById("btn-save-card");
  if (btnSaveCard) btnSaveCard.onclick = saveCardForm;

  const overlayImport = document.getElementById("overlay-import");
  if (overlayImport) overlayImport.onclick = (e) => { if (e.target === overlayImport) { state.showImport = false; render(); } };
  const closeImport = document.getElementById("close-import");
  if (closeImport) closeImport.onclick = () => { state.showImport = false; render(); };
  const inputImport = document.getElementById("input-import");
  if (inputImport) { inputImport.focus(); inputImport.oninput = (e) => { state.importText = e.target.value; render(); }; }
  const btnRunImport = document.getElementById("btn-run-import");
  if (btnRunImport) btnRunImport.onclick = runImport;

  const overlayExport = document.getElementById("overlay-export");
  if (overlayExport) overlayExport.onclick = (e) => { if (e.target === overlayExport) { state.showExport = false; render(); } };
  const closeExport = document.getElementById("close-export");
  if (closeExport) closeExport.onclick = () => { state.showExport = false; render(); };
  const btnCopyExport = document.getElementById("btn-copy-export");
  if (btnCopyExport) btnCopyExport.onclick = async () => {
    const ta = document.getElementById("export-text");
    try {
      await navigator.clipboard.writeText(ta.value);
      const prev = btnCopyExport.textContent;
      btnCopyExport.textContent = "✓ Kopyalandı";
      setTimeout(() => { btnCopyExport.textContent = prev; }, 1500);
    } catch (err) {
      ta.select();
      document.execCommand("copy");
    }
  };

  const btnExitStudy = document.getElementById("btn-exit-study");
  if (btnExitStudy) btnExitStudy.onclick = () => { state.view = "deck"; render(); };
  const btnEditStudyCard = document.getElementById("btn-edit-study-card");
  if (btnEditStudyCard) btnEditStudyCard.onclick = () => {
    const c = state.queue[state.qIndex];
    if (!c) return;
    state.editingCardId = c.id;
    state.formFront = c.front; state.formBack = c.back;
    state.formVisibility = c.visibility || "both";
    state.focusFrontOnOpen = false;
    state.showCardForm = true; render();
  };
  const flipCard = document.getElementById("flip-card");
  if (flipCard) flipCard.onclick = () => { state.flipped = !state.flipped; render(); };
  const btnWrong = document.getElementById("btn-wrong");
  if (btnWrong) btnWrong.onclick = () => handleFlipAnswer("wrong");
  const btnKnow = document.getElementById("btn-know");
  if (btnKnow) btnKnow.onclick = () => handleFlipAnswer("know");
  const btnMaster = document.getElementById("btn-master");
  if (btnMaster) btnMaster.onclick = () => handleFlipAnswer("master");
  const btnPrevCard = document.getElementById("btn-prev-card");
  if (btnPrevCard) btnPrevCard.onclick = goToPreviousCard;
  const btnUndo = document.getElementById("btn-undo");
  if (btnUndo) btnUndo.onclick = undoLastAction;
  document.querySelectorAll("[data-mc-option]").forEach((el) => { el.onclick = () => handleMcSelect(el.dataset.mcOption); });
  const btnMcNext = document.getElementById("btn-mc-next");
  if (btnMcNext) btnMcNext.onclick = advanceQueue;

  const btnSummaryDone = document.getElementById("btn-summary-done");
  if (btnSummaryDone) btnSummaryDone.onclick = () => { state.view = "deck"; render(); };
}

render();
</script>
</body>
</html>
